# PDScope 跨平台构建
#
# Tauri 最后一步要链各平台的系统 WebView（Windows→WebView2、macOS→WKWebView、
# Linux→WebKitGTK），三者都没有交叉编译的路子，所以每个目标都要一台对应系统与
# 架构的机器各构建一次。
#
# 目标清单（产物名 = PDScope-<目标>）：
#   windows11-x64      windows-2025      x86_64-pc-windows-msvc      exe 安装包 + msi + 绿色版
#   windows11-arm64    windows-11-arm    aarch64-pc-windows-msvc     exe 安装包 + 绿色版
#   macos15-arm64      macos-15          aarch64-apple-darwin        app + dmg
#   macos15-x64        macos-15-intel    x86_64-apple-darwin         app + dmg
#   macos26-arm64      macos-26          aarch64-apple-darwin        app + dmg
#   macos26-x64        macos-26-intel    x86_64-apple-darwin         app + dmg
#   ubuntu2404-x64     ubuntu-24.04      x86_64-unknown-linux-gnu    deb + AppImage
#   ubuntu2404-arm64   ubuntu-24.04-arm  aarch64-unknown-linux-gnu   deb + AppImage
#   ubuntu2604-x64     ubuntu-26.04      x86_64-unknown-linux-gnu    deb + AppImage
#   ubuntu2604-arm64   ubuntu-26.04-arm  aarch64-unknown-linux-gnu   deb + AppImage
#
# ① 不含 Windows 10：GitHub 没有 Win10 镜像，且它与 windows11-x64 是同一个
#    Rust target、产物完全一样，Win10 直接用 windows11-x64 那份即可。
# ② glibc 下限跟着构建机走：ubuntu2404-* 的包要 glibc ≥ 2.39、ubuntu2604-* 要 ≥ 2.42。
#    要发给老系统就用 2404 那份。

name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 同一分支串行执行：分支上「改了又推」很常见，直接把上一轮掐掉省时间。
# 标签是发版动作，不能掐，必须跑完。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy（AppImage 的打包工具）自身是 AppImage，默认要挂 FUSE，CI 容器里常常没有
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ───────────────────────────────────────────────
          - name: windows11-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: 'nsis,msi'
            note: 'Windows 10 也用这份（同一 target，产物相同）'

          - name: windows11-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: 'nsis'
            note: '唯一的原生 arm64 Windows 镜像；WiX 的 arm64 MSI 未验证，故只出 exe 安装包（NSIS）'

          # ── macOS ─────────────────────────────────────────────────
          - name: macos15-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: 'app,dmg'
            note: 'macOS 15 / Apple Silicon'

          - name: macos15-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: 'app,dmg'
            note: 'macOS 15 / Intel'

          - name: macos26-arm64
            os: macos-26
            target: aarch64-apple-darwin
            bundles: 'app,dmg'
            note: 'macOS 26 / Apple Silicon'

          - name: macos26-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            bundles: 'app,dmg'
            note: 'macOS 26 / Intel'

          # ── Linux ─────────────────────────────────────────────────
          - name: ubuntu2404-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: 'deb,appimage'
            note: 'glibc ≥ 2.39；发给老系统用这份'

          - name: ubuntu2404-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: 'deb,appimage'
            note: 'glibc ≥ 2.39 / arm64'

          - name: ubuntu2604-x64
            os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            bundles: 'deb,appimage'
            note: 'glibc ≥ 2.42，不要在 24.04 及更老系统上跑'

          - name: ubuntu2604-arm64
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: 'deb,appimage'
            note: 'glibc ≥ 2.42 / arm64'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # 产物名的「版本段」：推 v* 标签（发版）就是纯版本号（v0.3.0），
      # 普通推送则是 v0.3.0_<8 位短 commit>_<YYYYMMDD>，一眼能看出是哪次提交、哪天出的。
      # 版本号从 package.json 读，短 commit 与日期从环境取，写进 GITHUB_ENV 供后续步骤共用。
      - name: 定产物版本段
        shell: bash
        run: |
          ver="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            suffix=""
          else
            short="$(echo "${GITHUB_SHA:-$GITHUB_REF}" | cut -c1-8)"
            date="$(date -u +%Y%m%d)"
            suffix="_${short}_${date}"
          fi
          echo "VERSEG=${ver}${suffix}" >> "$GITHUB_ENV"
          echo "产物版本段：${ver}${suffix}"

      # 仓库里的 src-tauri/.cargo/config.toml 是给国内开发机用的 USTC 镜像，
      # 海外 runner 走官方源更快更稳，先删掉
      - name: 切回 crates.io 官方源
        run: node -e "require('node:fs').rmSync('src-tauri/.cargo/config.toml',{force:true})"

      # 包名跨 Ubuntu 版本会改（libgtk-3-0 → libgtk-3-0t64），逐个装、装不上只警告，
      # 最后再断言真正必须的 webkit2gtk-4.1，这样 24.04 / 26.04 能共用一份脚本
      - name: 装 Linux 系统依赖
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          set -u -o pipefail
          sudo apt-get update || echo "::warning::apt-get update 失败，继续试装"
          for p in libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
                   libayatana-appindicator3-dev libssl-dev patchelf file \
                   build-essential curl wget zip; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning title=依赖缺失::$p 在这个 Ubuntu 版本上装不上，继续"
          done
          pkg-config --exists webkit2gtk-4.1 \
            || { echo "::error title=缺少核心依赖::没有 libwebkit2gtk-4.1-dev，构建不可能成功"; exit 1; }
          echo "webkit2gtk-4.1 就位"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}
          # 每个目标各一份缓存，全回写会顶满仓库 10 GB 配额，所以只在默认分支回写
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
          cache-on-failure: true

      - run: npm install --no-audit --no-fund

      # 只跑不依赖抓包样本的三项：ackcheck.js 与 e2e.mjs 要读仓库上一级的 *.atkcc
      # 实测样本，而那些文件按 .gitignore 不入库，想跑就在本机 npm run check
      - name: 版本号 / 语法 / 协议层自检
        run: |
          node tools/version-check.mjs
          node tools/syntax.mjs
          node tools/selftest.js

      # bundles 的值必须加引号，否则 PowerShell 会把 nsis,msi 当数组拆成两个参数。
      # 值只能用 Tauri 的 bundle 名（Windows 是 nsis / msi）；exe 安装包由 nsis 打包器产出。
      # 要签名 macOS 包时在本步补 env，别塞空值 —— Tauri 见到空字符串的
      # APPLE_CERTIFICATE 会当成「有证书」去解析，反而报错。
      - name: 构建可执行文件与安装包
        run: npm run app:build -- --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      # 产物散着传（不打大包），每个文件统一重命名成
      #   PDScope-<目标>-<版本段>-<内容>.<ext>
      # 版本段：发版 = v0.3.0，普通推送 = v0.3.0_<短commit>_<日期>。
      # macOS 只出 .dmg：dmg 挂载后里面就是 .app + 指向 /Applications 的软链，
      # 拖进 Applications 即完成安装，不需要再单独出一份 .app 包。
      - name: 归置产物（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          b="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="PDScope-${{ matrix.name }}-${{ env.VERSEG }}"
          mkdir -p "$out"
          # 按 bundle 目录类型逐个重命名归置（跳过 macos/ 目录：.app 已在 dmg 里）。
          # 每个目录里 Tauri 可能额外产出 .blockmap / .sig 等文件，所以用 find 按后缀
          # 精确定位主产物，而不是 cp 目录下所有文件（那会撞名报「not a directory」）。
          if [ -d "$b/dmg" ]; then
            f=$(find "$b/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
            [ -n "$f" ] && cp "$f" "$out/$out.dmg"
          fi
          if [ -d "$b/deb" ]; then
            f=$(find "$b/deb" -maxdepth 1 -name '*.deb' -print -quit)
            [ -n "$f" ] && cp "$f" "$out/$out.deb"
          fi
          # AppImage 体积大（~165 MB，几乎全是 WebKitGTK），zip 压缩能省下一截传输体积。
          # 解压后记得 chmod +x 再跑（zip 不保留可执行位）。
          if [ -d "$b/appimage" ]; then
            f=$(find "$b/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
            if [ -n "$f" ]; then
              cp "$f" "$out/$out.AppImage"
              ( cd "$out" && zip -9 "$out.AppImage.zip" "$out.AppImage" && rm "$out.AppImage" )
            fi
          fi
          echo "归置后的产物："
          ls -lh "$out"

      # Windows 产物散着传（不打 zip），每个文件统一重命名成
      #   PDScope-<目标>-<版本段>-<内容>.<ext>
      # 安装包（exe 安装包，由 NSIS 产出的 setup.exe / MSI）与绿色版单 exe 各一个文件。
      - name: 归置产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          $out = "PDScope-${{ matrix.name }}-${{ env.VERSEG }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$rel/pdscope.exe" "$out/$out-portable.exe"
          if (Test-Path "$rel/bundle/nsis") { $f = Get-ChildItem "$rel/bundle/nsis/*-setup.exe" | Select-Object -First 1; if ($f) { Copy-Item $f "$out/$out-setup.exe" } }
          if (Test-Path "$rel/bundle/msi")  { $f = Get-ChildItem "$rel/bundle/msi/*.msi"  | Select-Object -First 1; if ($f) { Copy-Item $f "$out/$out-setup.msi" } }
          Get-ChildItem $out | Format-Table Name, Length -AutoSize

      # 每个产物文件单独配一个同名 .sha256（内容一行一文件，与 sha256sum -c 兼容）。
      # 脚本扫描产物目录、排除自身生成的 .sha256，避免二次哈希。
      - name: 生成 SHA256 校验和
        shell: bash
        run: node tools/ci-checksum.mjs --dir "PDScope-${{ matrix.name }}-${{ env.VERSEG }}"

      # 每个产物文件单独一个 artifact，且用 archive:false 直传裸文件（不打 zip）：
      # Artifacts 列表里每一项就是一个文件，下载下来就是文件本身。
      # archive:false 时只能传单个文件、且 name 参数失效 —— 文件名（带版本段）会直接
      # 用作 artifact 名，所以列表里看到的就是 PDScope-<目标>-<版本段>-<内容>.<ext>。
      # path 用精确文件名（归置脚本已保证确定性命名），避免 glob 误匹配到多个文件导致
      # archive:false 报错。每个产物文件后面紧跟着它的 .sha256，也逐个直传、名字对得上。
      # 用 contains(matrix.bundles, ...) 判断该目标是否产这个文件，缺 MSI 的 arm64 不会误传。

      - name: 上传 exe 安装包
        if: contains(matrix.bundles, 'nsis')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-setup.exe
          archive: false

      - name: 上传 exe 校验和
        if: contains(matrix.bundles, 'nsis')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-setup.exe.sha256
          archive: false

      - name: 上传 MSI 安装包
        if: contains(matrix.bundles, 'msi')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-setup.msi
          archive: false

      - name: 上传 MSI 校验和
        if: contains(matrix.bundles, 'msi')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-setup.msi.sha256
          archive: false

      - name: 上传绿色版 exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-portable.exe
          archive: false

      - name: 上传绿色版校验和
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}-portable.exe.sha256
          archive: false

      - name: 上传 dmg
        if: contains(matrix.bundles, 'dmg')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.dmg
          archive: false

      - name: 上传 dmg 校验和
        if: contains(matrix.bundles, 'dmg')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.dmg.sha256
          archive: false

      - name: 上传 deb
        if: contains(matrix.bundles, 'deb')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.deb
          archive: false

      - name: 上传 deb 校验和
        if: contains(matrix.bundles, 'deb')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.deb.sha256
          archive: false

      - name: 上传 AppImage
        if: contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.AppImage.zip
          archive: false

      - name: 上传 AppImage 校验和
        if: contains(matrix.bundles, 'appimage')
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          retention-days: 30
          path: PDScope-${{ matrix.name }}-${{ env.VERSEG }}/PDScope-${{ matrix.name }}-${{ env.VERSEG }}.AppImage.zip.sha256
          archive: false

      - name: 写运行摘要
        if: always()
        shell: bash
        run: |
          # 摘要里只给人看产物名，所以把 Tauri 的 bundle 名换成产物名的说法：
          # nsis 产出的就是 exe 安装包（*-setup.exe），写成 nsis 反而不好认。
          # 仅影响这行展示，构建用的 matrix.bundles 仍是 nsis。
          bundles_display="${{ matrix.bundles }}"
          bundles_display="${bundles_display//nsis/exe}"
          {
            echo "### \`${{ matrix.name }}\`"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| runner | \`${{ matrix.os }}\` |"
            echo "| Rust target | \`${{ matrix.target }}\` |"
            echo "| 安装包 | ${bundles_display} |"
            echo "| 说明 | ${{ matrix.note }} |"
          } >> "$GITHUB_STEP_SUMMARY" || true

  # 推 v* 标签时把全部产物汇总到一个草稿 Release：产物没签名，先让人看一眼再决定发不发
  release:
    name: 汇总 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: PDScope-*
          merge-multiple: true

      - run: ls -lh dist

      - name: 建 Release 并附上全部产物（已存在就补传覆盖）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f | sort)
          printf '共 %d 个文件\n' "${#files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "PDScope $GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              "${files[@]}"
          fi
