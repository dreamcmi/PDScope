function vpdVdo(em, v, facts) {
  const hw = pdField(v, 31, 28), fw = pdField(v, 27, 24), vdoVer = pdField(v, 23, 21);
  em.detail(`HW Version [${pdRange(31, 28)}]`, `0x${hw.toString(16).toUpperCase()}`);
  em.detail(`Firmware Version [${pdRange(27, 24)}]`, `0x${fw.toString(16).toUpperCase()}`);
  em.detail(`VDO Version [${pdRange(23, 21)}]`, vdoVer === 0 ? 'Version 1.0' : '无效取值（不得使用）');
  em.detail(`Reserved [${pdRange(20, 17)}]`, `0x${pdField(v, 20, 17).toString(16).toUpperCase()}`);
  const ct = pdBit(v, 0);
  em.detail(`Maximum VBUS Voltage [${pdRange(16, 15)}]`, VPD_VBUS_VOLTAGE[pdField(v, 16, 15)]);
  em.detail('Charge Through Current Support [B14]', ct
    ? (pdBit(v, 14) ? '1（5 A）' : '0（3 A）')
    : `${pdBit(v, 14)}（未开启 Charge Through，此域 Reserved）`);
  em.detail('Reserved [B13]', pdBit(v, 13));
  const vbusImp = pdField(v, 12, 7), gndImp = pdField(v, 6, 1);
  em.detail(`VBUS Impedance [${pdRange(12, 7)}]`, ct ? `${vbusImp * 2} mΩ（2mΩ 步长）` : 'Reserved（未开启 Charge Through）');
  em.detail(`Ground Impedance [${pdRange(6, 1)}]`, ct ? `${gndImp} mΩ（1mΩ 步长）` : 'Reserved（未开启 Charge Through）');
  em.detail('Charge Through Support [B0]', pdFlag(ct, '支持 Charge Through（可为下游供电）', '不支持'));
  facts.push(`VPD${ct ? ' 支持 Charge Through' : ''}`);
  return v;
}

/** 旧版 AMA VDO（PD 3.0 Table 6-37 / PD 2.0 Table 6-30） */
function amaVdo(em, v, ctx, facts) {
  em.detail('说明', 'AMA（Alternate Mode Adapter）产品类型已被 PD 3.1 废弃，新设计应改用 UFP VDO');
  em.detail(`HW Version [${pdRange(31, 28)}]`, `0x${pdField(v, 31, 28).toString(16).toUpperCase()}`);
  em.detail(`Firmware Version [${pdRange(27, 24)}]`, `0x${pdField(v, 27, 24).toString(16).toUpperCase()}`);
  if (!(ctx.revText === '2.0' || ctx.revText === '1.0')) {
    // 3.x（含 3.0）：有 VDO Version 字段，B20…8 保留
    em.detail(`VDO Version [${pdRange(23, 21)}]`, pdField(v, 23, 21) === 0 ? 'Version 1.0' : '保留值（不得使用）');
    em.detail(`Reserved [${pdRange(20, 8)}]`, `0x${pdField(v, 20, 8).toString(16).toUpperCase()}`);
  } else {
    // PD 2.0：B23…12 保留，B11…8 是四路 SuperSpeed 方向性
    em.detail(`Reserved [${pdRange(23, 12)}]`, `0x${pdField(v, 23, 12).toString(16).toUpperCase()}`);
    em.detail('SSTX1 Directionality [B11]', pdBit(v, 11) ? '1（可配置）' : '0（固定）');
    em.detail('SSTX2 Directionality [B10]', pdBit(v, 10) ? '1（可配置）' : '0（固定）');
    em.detail('SSRX1 Directionality [B9]', pdBit(v, 9) ? '1（可配置）' : '0（固定）');
    em.detail('SSRX2 Directionality [B8]', pdBit(v, 8) ? '1（可配置）' : '0（固定）');
  }
  em.detail(`VCONN power [${pdRange(7, 5)}]`, pdBit(v, 4) ? VCONN_POWER[pdField(v, 7, 5)] : 'Reserved（未要求 VCONN）');
  em.detail('VCONN required [B4]', pdFlag(pdBit(v, 4)));
  em.detail('VBUS required [B3]', pdBit(v, 3) ? '1（不需要 VBUS）' : '0（需要 VBUS）');
  em.detail(`USB SuperSpeed Signaling Support [${pdRange(2, 0)}]`, AMA_SUPERSPEED_V30[pdField(v, 2, 0)]);
  facts.push('AMA（已废弃形态）');
  return v;
}

/** 产品类型的中文短名（仅供一句话摘要；带规范原文的完整名称在详情各字段里） */
const PT_SHORT = {
  cable: { 0: '非线缆插头', 3: '无源线缆', 4: '有源线缆', 6: 'VPD（VCONN 供电设备）' },
  ufp: { 0: '非 UFP', 1: 'PDUSB Hub', 2: 'PDUSB 外设', 3: 'PSD（电源设备）', 5: 'AMA（已废弃）' },
  dfp: { 0: '非 DFP', 1: 'PDUSB Hub', 2: 'PDUSB Host', 3: 'Power Brick' },
};

/**
 * ID Header 的关键信息 → 若干条独立事实。
 * 拆成多条而不是一句话，是为了让 Product Type VDO 自己也推入的「无源线缆」等
 * 事实能与这里的重复项合并（摘要处按整条去重），摘要不会出现两遍同样的内容。
 */
function identityFacts(info) {
  const out = [];
  if (info.cable) {
    if (info.ptUfp) out.push(PT_SHORT.cable[info.ptUfp] ?? `保留产品类型 ${info.ptUfp}`);
  } else {
    // 端口侧 UFP / DFP 各有一个产品类型字段；为 0 表示「不是该角色」，不必写出来
    const u = info.ptUfp ? (PT_SHORT.ufp[info.ptUfp] ?? `保留产品类型 ${info.ptUfp}`) : null;
    const d = info.ptDfp ? (PT_SHORT.dfp[info.ptDfp] ?? `保留产品类型 ${info.ptDfp}`) : null;
    if (u && d && u !== d) out.push(`${u} / ${d}`);
    else if (u) out.push(u);
    else if (d) out.push(d);
  }
  if (info.vid) {
    const vn = svidName(info.vid);
    out.push(`VID 0x${pdHex(info.vid, 4)}${vn ? `（${vn.replace('（厂商 ID）', '')}）` : ''}`);
  }
  return out;
}

/* ══════════════════ Discover SVIDs ══════════════════ */

function decodeDiscoverSvids(st, em, vdos, ctx, ack, facts) {
  if (ack !== 'ACK') {
    pushNonAckFact(facts, ack, vdos, 'Discover SVIDs');
    return;
  }
  if (!vdos.length) {
    em.note('⚠ Discover SVIDs ACK 未携带 VDO');
    return;
  }
  const list = [];
  vdos.forEach((v, i) => {
    const a = pdField(v, 31, 16), b = pdField(v, 15, 0);
    em.object(`VDO #${i + 2} · Responder VDO（两个 SVID）`);
    em.detail('SVID n [B31-16]', a === 0 ? '0x0000（列表结束）' : svidText(a));
    em.detail('SVID n+1 [B15-0]', b === 0 ? '0x0000（列表结束）' : svidText(b));
    if (a) list.push(a);
    if (b) list.push(b);
  });
  st.svidList = list.slice();
  facts.push(list.length ? `SVID: ${list.map((s) => `0x${pdHex(s, 4)}`).join(', ')}` : '无 SVID');
  return list;
}

/* ══════════════════ Discover Modes ══════════════════ */

function decodeDiscoverModes(st, em, vdos, ctx, ack, svid, facts) {
  if (ack !== 'ACK') {
    pushNonAckFact(facts, ack, vdos, 'Discover Modes');
    return;
  }
  if (!vdos.length) {
    em.note('⚠ Discover Modes ACK 未携带 VDO');
    return;
  }
  const name = svidName(svid);
  vdos.forEach((v, i) => {
    em.object(`VDO #${i + 2} · Mode VDO #${i + 1}`);
    em.detail('对象位置', `${i + 1}（Enter/Exit Mode 用该值引用本 Mode）`);
    em.detail('原始值', `0x${pdHex(v)}`);
    if (svid === SVID_PD) {
      em.detail('说明', 'PD SID（0xFF00）下不应出现 Mode VDO');
    } else {
      em.detail('说明', `Mode VDO 的内容由 SVID ${name ?? `0x${pdHex(svid, 4)}`} 的标准/厂商定义，本工具按原始值展示`);
    }
  });
  facts.push(`SVID 0x${pdHex(svid, 4)} 的 ${vdos.length} 个 Mode VDO`);
  return vdos.length;
}

/* ══════════════════ Enter / Exit Mode ══════════════════ */

function decodeEnterExitMode(em, vdos, ctx, ack, label, facts) {
  if (vdos.length) {
    em.object(`VDO #2 · ${label} 携带的 SVID 自定义数据`);
    em.detail('原始值', `0x${pdHex(vdos[0])}`);
    em.detail('说明', 'Enter Mode 请求最多带 1 个 VDO，内容由 Alternate Mode 定义；ACK/NAK 不带 VDO');
  }
  if (ack === 'BUSY') facts.push('⚠ BUSY 不是 Enter/Exit Mode 的合法响应（规范只允许 ACK/NAK）');
  return null;
}

/* ══════════════════ Attention ══════════════════ */

function decodeAttention(em, vdos, ctx, svid, facts) {
  if (vdos.length) {
    em.object('VDO #2 · Attention 携带的 SVID 自定义数据');
    em.detail('原始值', `0x${pdHex(vdos[0])}`);
    em.detail('说明', 'Attention 最多带 1 个 VDO，内容由 Alternate Mode 定义');
  }
  em.detail('响应要求', 'Attention 不需要响应（GoodCRC 之外无应答）');
  return null;
}

/* ══════ src/js/pd/extended.js ══════ */
/**
 * extended.js — 扩展消息数据块解析（PD 3.2 Chapter 6.5）
 *
 * 全部按「数据块内的绝对字节号」寻址，与规范表格一一对应（Byte0、Byte1…）。
 * 分块（Chunked）场景下由调用方给出本包覆盖的字节区间 `off`，
 * 字节不在本包内就如实标注，不猜。
 *
 * 覆盖：SCEDB / SDB(SOP 与 SOP' 两种格式) / GBCDB / GBSDB / BCDB /
 *       Manufacturer_Info / Security_* / Firmware_Update_* / PPSSDB /
 *       CIDB / CCDB / SKEDB / ECDB / EPR_*_Capabilities / Vendor_Defined_Extended
 */






/* ── 字节读取（越界返回 null，交由调用方标注“本分块不含该字段”）── */
const b8 = (bk, i) => (i >= bk.off && i < bk.off + bk.bytes.length ? bk.bytes[i - bk.off] : null);
const b16 = (bk, i) => { const a = b8(bk, i), b = b8(bk, i + 1); return a === null || b === null ? null : a | (b << 8); };
const b32 = (bk, i) => { const v = b16(bk, i), w = b16(bk, i + 2); return v === null || w === null ? null : (v | (w << 16)) >>> 0; };

/** 把一段字节读成「可用」文本；不在本包内则给提示 */
const need = (v, text) => (v === null ? '（本分块不含该字段）' : text(v));

/** 按 4 字节对象分组，让详情页的分组标题与数据对象对齐 */
function groupOf(bk, byteIdx) {
  return Math.floor(byteIdx / 4);
}
/** 发一个新分组（同一 4 字节对象只发一次） */
function mkGroup(em, bk, byteIdx) {
  const g = groupOf(bk, byteIdx);
  if (bk._group !== g) {
    bk._group = g;
    em.object(`数据对象 #${g + 1} · Byte ${g * 4}~${g * 4 + 3}`);
  }
}
/** 在某个字节位置写一条字段（自动归到对应的 4 字节对象分组） */
function f(em, bk, byteIdx, key, value) {
  mkGroup(em, bk, byteIdx);
  em.detail(key, value);
}

/* ══════════════════ 入口 ══════════════════ */

/**
 * @param {object} st  解码器状态
 * @param {object} em  详情发射器
 * @param {number} t   扩展消息类型
 * @param {object} bk  { bytes, off, dataSize, chunked, chunkNum, reqChunk }
 * @param {object} ctx { revText, link, sopName }
 * @returns {string} 概览片段
 */
function extendedParse(st, em, t, bk, ctx) {
  bk._group = -1;
  switch (t) {
    case 1: return scedb(st, em, bk);
    case 2: return statusBlock(em, bk, ctx);
    case 3: return batteryRef(em, bk, 'Get Battery Cap', 'Battery Cap Ref');
    case 4: return batteryRef(em, bk, 'Get Battery Status', 'Battery Status Ref');
    case 5: return bcdb(em, bk);
    case 6: return getManufacturerInfo(em, bk);
    case 7: return manufacturerInfo(em, bk);
    case 8: case 9: return security(em, bk, t === 8 ? 'Security_Request' : 'Security_Response');
    case 10: case 11: return firmware(em, bk, t === 10 ? 'Firmware_Update_Request' : 'Firmware_Update_Response');
    case 12: return ppsStatus(em, bk);
    case 13: return countryInfo(em, bk);
    case 14: return countryCodes(em, bk);
    case 15: return skedb(st, em, bk);
    case 16: return extControl(em, bk);
    case 17: case 18: return eprCaps(st, em, bk, t === 17 ? 'source' : 'sink');
    case 30: return vendorDefinedExtended(em, bk);
    default:
      hexDump(em, bk);
      return `未定义的扩展消息类型 ${t}`;
  }
}

/* ══════════════════ ① Source_Capabilities_Extended（SCEDB）══════════════════ */

function scedb(st, em, bk) {
  const vid = b16(bk, 0), pid = b16(bk, 2), xid = b32(bk, 4);
  f(em, bk, 0, `Vendor ID [Byte1-0]`, need(vid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 2, `Product ID [Byte3-2]`, need(pid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 4, `XID [Byte7-4]`, need(xid, (v) => `0x${pdHex(v)}（应与 Cert Stat VDO 一致）`));
  f(em, bk, 8, `FW Version [Byte8]`, need(b8(bk, 8), (v) => String(v)));
  f(em, bk, 9, `HW Version [Byte9]`, need(b8(bk, 9), (v) => String(v)));

  const vreg = b8(bk, 10);
  f(em, bk, 10, `Voltage Regulation [Byte10]`, need(vreg, (v) =>
    `Load Step ${LOAD_STEP[v & 3]} · IoC ${(v >> 2) & 1 ? '90%' : '25% (default)'}`));
  f(em, bk, 11, `Holdup Time [Byte11]`, need(b8(bk, 11), (v) => (v === 0 ? '不支持该特性 (0)' : `${v} ms（断 AC 后维持稳压的时间）`)));

  const comp = b8(bk, 12);
  f(em, bk, 12, `Compliance [Byte12]`, need(comp, (v) =>
    [v & 1 ? 'LPS' : null, (v >> 1) & 1 ? 'PS1' : null, (v >> 2) & 1 ? 'PS2' : null].filter(Boolean).join(' + ') || '无'));
  const touch = b8(bk, 13);
  f(em, bk, 13, `Touch Current [Byte13]`, need(touch, (v) =>
    [v & 1 ? '低接触电流 EPS' : null, (v >> 1) & 1 ? '有接地脚' : null, (v >> 2) & 1 ? '接地脚接保护地 (PE)' : null].filter(Boolean).join(' + ') || '无'));

  const pc1 = b16(bk, 14), pc2 = b16(bk, 16), pc3 = b16(bk, 18);
  peak(em, bk, 14, 'Peak Current 1', pc1);
  peak(em, bk, 16, 'Peak Current 2', pc2);
  peak(em, bk, 18, 'Peak Current 3', pc3);

  f(em, bk, 20, `Touch Temp [Byte20]`, need(b8(bk, 20), (v) => TOUCH_TEMP_SOURCE[v] ?? '取值无效，按默认处理'));
  const si = b8(bk, 21);
  f(em, bk, 21, `Source Inputs [Byte21]`, need(si, (v) => [
    (v & 1) ? `外部电源在位${(v >> 1) & 1 ? '（不受限）' : '（受限）'}` : '无外部电源',
    (v & 4) ? '有内部电池' : null,
  ].filter(Boolean).join(' · ')));
  const nb = b8(bk, 22);
  f(em, bk, 22, `Number of Batteries/Slots [Byte22]`, need(nb, (v) =>
    `固定电池 ${v & 0xF} 个 · 热插拔电池槽 ${(v >> 4) & 0xF} 个`));
  f(em, bk, 23, `SPR Source PDP Rating [Byte23]`, need(b8(bk, 23), (v) => (v > 100 ? `${v}（>100 视为无效）` : `${v} W`)));
  f(em, bk, 24, `EPR Source PDP Rating [Byte24]`, need(b8(bk, 24), (v) => (v > 240 ? `${v}（>240 视为无效）` : `${v} W`)));

  const parts = [];
  if (vid !== null) parts.push(`VID 0x${pdHex(vid, 4)}`);
  if (b8(bk, 23) !== null) parts.push(`SPR PDP ${b8(bk, 23)}W`);
  if (b8(bk, 24)) parts.push(`EPR PDP ${b8(bk, 24)}W`);
  return parts.join(' · ');
}

function peak(em, bk, byteIdx, name, v) {
  if (v === null) { f(em, bk, byteIdx, `${name} [Byte${byteIdx + 1}-${byteIdx}]`, '（本分块不含该字段）'); return; }
  const overload = Math.min(v & 0x1F, 25) * 10;
  const period = ((v >> 5) & 0x3F) * 20;
  const duty = ((v >> 11) & 0xF) * 5;
  const droop = (v >> 15) & 1;
  f(em, bk, byteIdx, `${name} [Byte${byteIdx + 1}-${byteIdx}]`,
    overload === 0
      ? '未提供峰值能力（全 0）'
      : `过载 ${overload}% · 周期 ${period} ms · 占空比 ${duty}% · 允许 VBUS 跌落 ${droop ? '是（额外 5%）' : '否'}`);
}

/* ══════════════════ ② Status（SDB / SOP' 状态）══════════════════ */

function statusBlock(em, bk, ctx) {
  // 内容由「发给谁」决定：发给 SOP' / SOP'' 时是线缆插头状态（PD 3.2 Table 6.52，仅 2 字节），
  // 发给 SOP 时才是端口伙伴状态（Table 6.51，7 字节）。用链路判定，长度只作兜底。
  if (ctx.link === 'cable' || bk.dataSize <= 2) {
    f(em, bk, 0, 'Internal Temp [Byte0]', need(b8(bk, 0), tempText));
    f(em, bk, 1, 'Flags [Byte1]', need(b8(bk, 1), (v) => {
      if (!(v & 1)) return '正常（未进入热关断）';
      const extra = v & 0xFE ? `（高位 0x${(v & 0xFE).toString(16).toUpperCase()} 为保留位）` : '';
      return `已进入热关断 Thermal Shutdown${extra} —— 置位后保持，只有 Hard Reset 或线缆断电才清除（Cable Reset 无效）`;
    }));
    const tc = b8(bk, 0), fl = b8(bk, 1);
    return [tc === null ? null : `线缆插头温度 ${tempText(tc)}`,
      fl === null ? null : `热关断标记 ${(fl & 1) ? '已置位' : '未置位'}`].filter(Boolean).join(' · ');
  }

  f(em, bk, 0, 'Internal Temp [Byte0]', need(b8(bk, 0), tempText));
  const pi = b8(bk, 1);
  f(em, bk, 1, 'Present Input [Byte1]', need(pi, (v) => {
    const src = ['内部供电', '外部直流 (DC)', '取值无效', '外部交流 (AC)'][(v >> 1) & 3];
    const list = [src, (v & 8) ? '由电池供电' : null, (v & 16) ? '由非电池内部电源供电' : null].filter(Boolean);
    return list.join(' · ');
  }));
  const bi = b8(bk, 2);
  f(em, bk, 2, 'Present Battery Input [Byte2]', need(bi, (v) => {
    if (!(b8(bk, 1) & 8)) return `0x${v.toString(16).toUpperCase().padStart(2, '0')}（Present Input 未置电池供电，此域 Reserved）`;
    const on = [];
    for (let i = 0; i < 8; i++) if (v & (1 << i)) on.push(BATTERY_REF_TEXT(i));
    return on.length ? on.join(' · ') : '无电池供电';
  }));
  const ev = b8(bk, 3);
  f(em, bk, 3, 'Event Flag [Byte3]', need(ev, (v) => {
    const on = STATUS_EVENT_BITS.filter((b) => v & (1 << b.bit)).map((b) => b.name);
    return on.length ? on.join(' · ') : '无事件';
  }));
  const ts = b8(bk, 4);
  f(em, bk, 4, 'Temperature Status [Byte4]', need(ts, (v) => TEMP_STATUS[(v >> 1) & 3]));
  f(em, bk, 5, 'Power Status [Byte5]', need(b8(bk, 5), (v) => {
    if (ctx.link === 'cable') return `0x${v.toString(16).toUpperCase()}`;
    const on = POWER_STATUS_BITS.filter((b) => v & (1 << b.bit)).map((b) => b.name);
    return v === 0 ? '未受限（Sink 恒为 0）' : on.join(' · ');
  }));
  const ps = b8(bk, 6);
  f(em, bk, 6, 'Power State Change [Byte6]', need(ps, (v) =>
    `${POWER_STATE[v & 7] ?? '取值无效，按 0 处理'} · 指示灯 ${STATE_INDICATOR[(v >> 3) & 3] ?? '取值无效'}`));
  f(em, bk, 7, 'Reserved [Byte7]', need(b8(bk, 7), (v) => `0x${v.toString(16).toUpperCase()}`));

  const t = b8(bk, 0);
  const st = b8(bk, 6);
  return [t === null ? null : `内部温度 ${tempText(t)}`, st === null ? null : `电源状态 ${POWER_STATE[st & 7] ?? '—'}`]
    .filter(Boolean).join(' · ');
}

const tempText = (v) => (v === 0 ? '不支持温度检测 (0)' : (v === 1 ? '< 2 °C' : `${v} °C`));

/* ══════════════════ ③④ 取电池能力 / 状态 ══════════════════ */

function batteryRef(em, bk, label, fieldName) {
  const r = b8(bk, 0);
  em.object(`数据对象 #1 · Byte 0~3`);
  em.detail(`${fieldName} [Byte0]`, need(r, (v) => (v < 8 ? `${v} · ${BATTERY_REF_TEXT(v)}` : `${v} · 无效索引（对方应回 Invalid Battery Reference）`)));
  return r === null ? label : `${label} 电池 ${r}`;
}

/* ══════════════════ ⑤ Battery_Capabilities（BCDB）══════════════════ */

function bcdb(em, bk) {
  const vid = b16(bk, 0), pid = b16(bk, 2);
  const design = b16(bk, 4), full = b16(bk, 6);
  const type = b8(bk, 8);
  const capText = (v) => (v === null ? '（本分块不含该字段）'
    : (v === 0 ? '电池不存在 (0000h)' : (v === 0xFFFF ? '未知 (FFFFh)' : `${pdNum(v * 0.1)} Wh`)));
  f(em, bk, 0, 'Vendor ID [Byte1-0]', need(vid, (v) => `0x${pdHex(v, 4)}（电池厂商）`));
  f(em, bk, 2, 'Product ID [Byte3-2]', need(pid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 4, 'Battery Design Capacity [Byte5-4]', capText(design));
  f(em, bk, 6, 'Battery Last Full Charge Capacity [Byte7-6]', capText(full));
  f(em, bk, 8, 'Battery Type [Byte8]', need(type, (v) => pdFlag(v & 1, '无效电池引用', '电池引用有效')));
  return `设计容量 ${capText(design)} · 满充容量 ${capText(full)}`;
}

/* ══════════════════ ⑥⑦ Manufacturer_Info ══════════════════ */

function getManufacturerInfo(em, bk) {
  const target = b8(bk, 0), ref = b8(bk, 1);
  em.object('数据对象 #1 · Byte 0~3');
  em.detail('Manufacturer Info Target [Byte0]', need(target, (v) =>
    (v === 0 ? '0 · Port / Cable Plug' : (v === 1 ? '1 · Battery' : `${v} · 无效取值`))));
  em.detail('Manufacturer Info Ref [Byte1]', need(ref, (v) => {
    if (target !== 1) return `${v}（Target ≠ Battery 时 Reserved）`;
    return v < 8 ? `${v} · ${BATTERY_REF_TEXT(v)}` : `${v} · 无效索引`;
  }));
  return target === null ? 'Get Manufacturer Info' : `Get Manufacturer Info（${target === 1 ? '电池' : '端口/线缆'}）`;
}

function manufacturerInfo(em, bk) {
  const vid = b16(bk, 0), pid = b16(bk, 2);
  const strBytes = [];
  for (let i = 4; i < bk.dataSize; i++) {
    const b = b8(bk, i);
    if (b === null) break;
    strBytes.push(b);
  }
  const text = pdAscii(strBytes);
  f(em, bk, 0, 'Vendor ID [Byte1-0]', need(vid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 2, 'Product ID [Byte3-2]', need(pid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 4, 'Manufacturer String [Byte4…]', strBytes.length ? `"${text}"` : '（本分块不含该字段）');
  return text ? `厂商串 "${text}"` : '厂商串（空）';
}

/* ══════════════════ ⑧⑨⑩⑪ 安全 / 固件 ══════════════════ */

function security(em, bk, label) {
  em.object('数据块');
  em.detail('长度 [Data Size]', `${bk.dataSize} 字节${bk.chunked ? `（分块 ${bk.chunkNum}）` : ''}`);
  hexDump(em, bk);
  em.detail('说明', '内容为 [USBC Auth] 定义的认证数据结构，USB PD 规范不定义其内部格式');
  return `${label}（${bk.dataSize} 字节${bk.chunked ? '，分块' : ''}）`;
}

function firmware(em, bk, label) {
  em.object('数据块');
  em.detail('长度 [Data Size]', `${bk.dataSize} 字节${bk.chunked ? `（分块 ${bk.chunkNum}）` : ''}`);
  hexDump(em, bk);
  em.detail('说明', '内容为 [PDFU] 定义的固件升级数据结构，USB PD 规范不定义其内部格式');
  return `${label}（${bk.dataSize} 字节${bk.chunked ? '，分块' : ''}）`;
}

/** 原始字节转储（每 4 字节一个数据对象，与详情分组对齐） */
function hexDump(em, bk) {
  for (let i = 0; i < bk.bytes.length; i += 4) {
    const abs = bk.off + i;
    mkGroup(em, bk, abs);
    const chunk = bk.bytes.slice(i, i + 4);
    em.detail(`Byte ${abs}~${abs + chunk.length - 1}`, chunk.map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join(' '));
  }
}

/* ══════════════════ ⑫ PPS_Status（PPSSDB）══════════════════ */

function ppsStatus(em, bk) {
  const v = b16(bk, 0), i = b8(bk, 2), fl = b8(bk, 3);
  const vText = v === null ? '（本分块不含该字段）' : (v === 0xFFFF ? '不支持 (FFFFh)' : `${pdNum(v * 0.02)} V`);
  const iText = i === null ? '（本分块不含该字段）' : (i === 0xFF ? '不支持 (FFh)' : `${pdNum(i * 0.05)} A`);
  f(em, bk, 0, 'Output Voltage [Byte1-0]', vText);
  f(em, bk, 2, 'Output Current [Byte2]', iText);
  f(em, bk, 3, 'Real Time Flags [Byte3]', need(fl, (x) =>
    `PTF ${TEMP_STATUS[(x >> 1) & 3]} · OMF ${x & 8 ? 'Current Limit (CL)' : 'Constant Voltage (CV)'}`));
  return `输出 ${vText} / ${iText}`;
}

/* ══════════════════ ⑬⑭ 国家码 ══════════════════ */

function countryInfo(em, bk) {
  const code = b16(bk, 0);
  f(em, bk, 0, 'Country Code [Byte1-0]', need(code, (v) => `"${pdCharPair(v & 0xFF, (v >> 8) & 0xFF)}"`));
  f(em, bk, 2, 'Reserved [Byte3-2]', need(b16(bk, 2), (v) => `0x${pdHex(v, 4)}`));
  const data = [];
  for (let i = 4; i < bk.dataSize; i++) { const b = b8(bk, i); if (b === null) break; data.push(b); }
  f(em, bk, 4, 'Country Specific Data [Byte4…]', data.length ? `"${pdAscii(data)}"` : '（本分块不含该字段）');
  return `国家码 "${pdCharPair((code ?? 0) & 0xFF, ((code ?? 0) >> 8) & 0xFF)}"`;
}

function countryCodes(em, bk) {
  const len = b8(bk, 0);
  f(em, bk, 0, 'Length [Byte0]', need(len, (v) => `${v} 个国家和地区码（有效范围 1~12）`));
  f(em, bk, 1, 'Reserved [Byte1]', need(b8(bk, 1), (v) => `0x${v.toString(16)}`));
  const list = [];
  for (let n = 0; n < 12; n++) {
    const i = 2 + n * 2;
    if (i >= bk.dataSize) break;
    const v = b16(bk, i);
    if (v === null) break;
    const code = pdCharPair(v & 0xFF, (v >> 8) & 0xFF);
    if (code) list.push(code);
    f(em, bk, i, `Country Code ${n + 1} [Byte${i + 1}-${i}]`, `"${code}"`);
  }
  return `共 ${list.length} 个国家和地区码：${list.join(' ')}`;
}

/* ══════════════════ ⑮ Sink_Capabilities_Extended（SKEDB）══════════════════ */

function skedb(st, em, bk) {
  const vid = b16(bk, 0), pid = b16(bk, 2), xid = b32(bk, 4);
  f(em, bk, 0, 'VID [Byte1-0]', need(vid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 2, 'PID [Byte3-2]', need(pid, (v) => `0x${pdHex(v, 4)}`));
  f(em, bk, 4, 'XID [Byte7-4]', need(xid, (v) => `0x${pdHex(v)}（应与 Cert Stat VDO 一致）`));
  f(em, bk, 8, 'FW Version [Byte8]', need(b8(bk, 8), String));
  f(em, bk, 9, 'HW Version [Byte9]', need(b8(bk, 9), String));
  f(em, bk, 10, 'SKEDB Version [Byte10]', need(b8(bk, 10), (v) => (v === 1 ? 'Version 1.0' : `${v} · 无效取值（接收端应忽略本条）`)));
  f(em, bk, 11, 'Load Step [Byte11]', need(b8(bk, 11), (v) => LOAD_STEP[v & 3]));

  const load = b16(bk, 12);
  f(em, bk, 12, 'Sink Load Characteristics [Byte13-12]', need(load, (v) => {
    const ov = Math.min(v & 0x1F, 25) * 10;
    if ((v & 0x1F) === 0) return '未指定过载需求（全 0）';
    return `过载 ${ov}% · 周期 ${((v >> 5) & 0x3F) * 20} ms · 占空比 ${((v >> 11) & 0xF) * 5}%`
      + ` · 允许额外 5% VBUS 跌落 ${(v >> 15) & 1 ? '是' : '否'}`;
  }));
  f(em, bk, 14, 'Compliance [Byte14]', need(b8(bk, 14), (v) =>
    [v & 1 ? 'LPS' : null, (v >> 1) & 1 ? 'PS1' : null, (v >> 2) & 1 ? 'PS2' : null].filter(Boolean).join(' + ') || '无'));
  f(em, bk, 15, 'Touch Temp [Byte15]', need(b8(bk, 15), (v) => TOUCH_TEMP_SINK[v] ?? '取值无效，按默认处理'));
  const binfo = b8(bk, 16);
  f(em, bk, 16, 'Battery Info [Byte16]', need(binfo, (v) => `固定电池 ${v & 0xF} 个 · 热插拔电池槽 ${(v >> 4) & 0xF} 个`));
  const modes = b8(bk, 17);
  f(em, bk, 17, 'Sink Modes [Byte17]', need(modes, (v) =>
    [v & 1 ? '支持 PPS 充电' : null, (v >> 1) & 1 ? '可由 VBUS 供电' : null, (v >> 2) & 1 ? '可由 AC 供电' : null,
      (v >> 3) & 1 ? '可由电池供电' : null, (v >> 4) & 1 ? '电池容量视为无限' : null, (v >> 5) & 1 ? '支持 AVS' : null]
      .filter(Boolean).join(' · ') || '无'));
  const sprs = b8(bk, 18), sprOp = b8(bk, 19), sprMax = b8(bk, 20);
  const eprs = b8(bk, 21), eprOp = b8(bk, 22), eprMax = b8(bk, 23);
  const w = (v) => (v === null ? '（本分块不含该字段）' : (v > 240 ? `${v}（超出有效范围）` : `${v} W`));
  f(em, bk, 18, 'SPR Sink Minimum PDP [Byte18]', w(sprs));
  f(em, bk, 19, 'SPR Sink Operational PDP [Byte19]', w(sprOp));
  f(em, bk, 20, 'SPR Sink Maximum PDP [Byte20]', w(sprMax));
  f(em, bk, 21, 'EPR Sink Minimum PDP [Byte21]', w(eprs));
  f(em, bk, 22, 'EPR Sink Operational PDP [Byte22]', w(eprOp));
  f(em, bk, 23, 'EPR Sink Maximum PDP [Byte23]', w(eprMax));

  return `SPR PDP ${sprs ?? '—'}/${sprOp ?? '—'}/${sprMax ?? '—'} W`
    + (eprMax ? ` · EPR PDP ${eprs ?? '—'}/${eprOp ?? '—'}/${eprMax} W` : '');
}

/* ══════════════════ ⑯ Extended_Control（ECDB）══════════════════ */

function extControl(em, bk) {
  const type = b8(bk, 0), data = b8(bk, 1);
  em.object('数据对象 #1 · Byte 0~3');
  em.detail('Type [Byte0]', need(type, (v) => `${v} · ${EXT_CONTROL_MSG_TYPES[v] ?? '无效，接收端应回 Not_Supported'}`));
  em.detail('Data [Byte1]', need(data, (v) => `0x${v.toString(16).padStart(2, '0').toUpperCase()}（表 6.63 规定为 0）`));
  return type === null ? 'Extended Control' : (EXT_CONTROL_MSG_TYPES[type] ?? `未知扩展控制类型 ${type}`);
}

/* ══════════════════ ⑰⑱ EPR 能力（PDO 列表，4 字节对齐）══════════════════ */

function eprCaps(st, em, bk, role) {
  const slots = pdoSlots(bk);
  const found = [];
  for (const s of slots) {
    em.object(`PDO #${s.index}`);
    if (s.value === null) {
      em.detail('状态', s.note);
      continue;
    }
    em.detail('对象位置', `${s.index}（Enter/Exit Mode 与 EPR_Request 用该位置引用）`);
    if (s.note) em.detail('分块对齐', s.note);
    const objPos = s.index;
    if (objPos <= 7 && s.value === 0) {
      em.detail('填充', 'SPR 槽位未使用，按 0 填充');
      found.push(`#${objPos} SPR 填充`);
      continue;
    }
    const isEpr = isEprPdo(s.value, objPos);
    const r = pdoParse(st, em, s.value, { role, position: objPos, isEpr, revText: '' });
    found.push(`#${objPos} ${r.summary}`);
  }
  return found.join(' · ') || '（无 PDO）';
}

/**
 * EPR 能力里的 PDO 是否为 EPR 档：位置 ≥8 直接判定；
 * 位置 ≤7 时按「固定电压 > 20V」或「AVS 型 APDO」判（与 sigrok/ATK 解码器一致）。
 */
function isEprPdo(pdo, objPos) {
  if (objPos >= 8) return true;
  const supplyType = pdField(pdo, 31, 30);
  if (supplyType === 0) return pdField(pdo, 19, 10) * 0.05 > 20.0;
  if (supplyType === 3) return pdField(pdo, 29, 28) === 1;
  return false;
}

/**
 * 把本分块的字节切成一串「4 字节对齐的 PDO 槽位」。
 * 分块起始若不在 4 字节边界上，会尝试用上一次分块存下的尾巴拼完整（st.extCarry）。
 */
function pdoSlots(bk) {
  const slots = [];
  const lead = bk.off % 4;
  let cur = bk.off;
  const end = bk.off + bk.bytes.length;

  if (lead !== 0) {
    const objIdx = Math.floor(bk.off / 4);
    const have = lead;                                  // 本包从这个对象的第 lead 个字节开始
    const prev = bk._carry;
    if (prev && prev.objIdx === objIdx && prev.bytes.length === have) {
      const full = prev.bytes.concat(bk.bytes.slice(0, 4 - have));
      slots.push({ index: objIdx + 1, value: bytesToU32(full), note: '由上一分块 + 本分块拼接' });
    } else {
      slots.push({ index: objIdx + 1, value: null, note: `跨分块（本包只有该对象的第 ${have}~3 字节）` });
    }
    cur = bk.off + (4 - have);
  }
  while (cur + 4 <= end) {
    slots.push({ index: Math.floor(cur / 4) + 1, value: bytesToU32(bk.bytes.slice(cur - bk.off, cur - bk.off + 4)), note: null });
    cur += 4;
  }
  // 尾部不足 4 字节 → 留给下一个分块
  if (cur < end) {
    bk._tail = { objIdx: Math.floor(cur / 4), bytes: Array.from(bk.bytes.slice(cur - bk.off)) };
  }
  return slots;
}

const bytesToU32 = (arr) => {
  let v = 0;
  for (let i = 0; i < Math.min(arr.length, 4); i++) v |= (arr[i] & 0xFF) << (8 * i);
  return v >>> 0;
};

/* ══════════════════ ㉚ Vendor_Defined_Extended ══════════════════ */

function vendorDefinedExtended(em, bk) {
  const svid = b16(bk, 0), cmd = b16(bk, 2);
  f(em, bk, 0, 'SVID [Byte1-0]', need(svid, (v) => svidText(v)));
  f(em, bk, 2, 'Command Space [Byte3-2]', need(cmd, (v) => `0x${pdHex(v, 4)}（B15 Reserved = ${(v >> 15) & 1}，B14-0 厂商命令 ${v & 0x7FFF}）`));
  const data = [];
  for (let i = 4; i < bk.dataSize; i++) { const b = b8(bk, i); if (b === null) break; data.push(b); }
  f(em, bk, 4, 'Vendor Defined Data [Byte4…]', data.length
    ? `${data.length} 字节 · ${data.slice(0, 16).map((x) => x.toString(16).padStart(2, '0').toUpperCase()).join(' ')}${data.length > 16 ? ' …' : ''}`
    : '（本分块不含该字段）');
  return `厂商扩展消息 SVID 0x${pdHex(svid ?? 0, 4)} · 命令 0x${pdHex(cmd ?? 0, 4)}`;
}

/* ══════ src/js/pd/data.js ══════ */
/**
 * data.js — 数据消息里除 PDO/RDO/VDM 之外的固定格式对象
 *
 *   BIST(BDO) / Battery_Status(BSDO) / Alert(ADO) / Enter_USB(EUDO)
 *   Source_Info(SIDO1/SIDO2) / Revision(RMDO) / EPR_Mode(EPRMDO) / Country_Code(CCDO)
 *
 * 依据 USB PD 3.2 Table 6.23…6.31；BIST 另按 PD 2.0 Table 6-x 区分旧值。
 */




/** 版本比较：'3.x'（3.0/3.1/3.2 共用该编码）按 3.0 参与比较 */
const atLeast = (revText, target) => revTextNum(revText) >= target;

/* ══════════════════ BIST ══════════════════ */

function bistParse(em, data, idx, ctx) {
  const mode = pdField(data, 31, 28);
  const legacy = atLeast(ctx.revText, 3.0) ? null : (BIST_MODES_V2[mode] ?? null);
  const modern = BIST_MODES_V3[mode] ?? null;
  em.object(`BIST 数据对象 #${idx + 1}`);
  em.detail(`BIST Test Mode [${pdRange(31, 28)}]`, `0x${mode.toString(16).toUpperCase()} · ${modern ?? legacy ?? '无效取值（接收端应忽略本条报文）'}`);
  if (modern && legacy) em.detail('PD 2.0 旧值', `${legacy}（同一数值在旧版规范里含义不同）`);
  em.detail(`Reserved [${pdRange(27, 0)}]`, `0x${pdHex(data).slice(2)}`);

  if (idx > 0) {
    em.note('非法：BIST 只应有 1 个数据对象');
    return 'BIST 数据对象数量非法';
  }
  const name = modern ?? legacy ?? `未知模式 ${mode}`;
  em.note(`模式 ${name}`);
  return `模式 ${name}`;
}

/* ══════════════════ Battery_Status（BSDO）══════════════════ */

function batteryStatusParse(em, data) {
  const cap = pdField(data, 31, 16);
  const status = pdField(data, 11, 10);
  const present = pdBit(data, 9);
  const invalidRef = pdBit(data, 8);
  const capText = cap === 0xFFFF ? '未知 (FFFFh)' : `${pdNum(cap * 0.1)} Wh`;

  em.detail(`电池当前容量 [${pdRange(31, 16)}]`, capText);
  em.detail(`Reserved [${pdRange(15, 12)}]`, `0x${pdField(data, 15, 12).toString(16).toUpperCase()}`);
  em.detail(`充电状态 [${pdRange(11, 10)}]`,
    present ? (CHARGE_STATE[status] ?? 'Invalid') : `Reserved（电池不存在）`);
  em.detail(`Battery Present [B9]`, pdFlag(present, '电池在位', '电池不在位'));
  em.detail(`Invalid Battery Reference [B8]`, pdFlag(invalidRef,
    '引用的电池不存在', '引用有效'));
  em.detail(`Reserved [${pdRange(7, 0)}]`, `0x${pdField(data, 7, 0).toString(16).padStart(2, '0').toUpperCase()}`);

  const s = `容量 ${capText} · ${present ? (CHARGE_STATE[status] ?? 'Invalid') : '电池不在位'}`
    + (invalidRef ? ' · 电池引用无效' : '');
  em.note(s);
  return s;
}

/* ══════════════════ Alert（ADO）══════════════════ */

function alertParse(em, data, idx) {
  const flags = pdField(data, 31, 24);
  em.object(`Alert 数据对象 #${idx + 1}（ADO）`);
  em.detail(`Type of Alert [${pdRange(31, 24)}]`, `0x${flags.toString(16).padStart(2, '0').toUpperCase()} = `
    + (flags ? '' : '无告警位'));

  const fired = [];
  for (const { bit, name } of ALERT_BITS) {
    if (bit === 24) { em.detail('Reserved [B24]', pdBit(data, 24)); continue; }
    const on = pdBit(data, bit);
    em.detail(`${name} [B${bit}]`, pdFlag(on));
    if (on) fired.push(name);
  }
  const fixed = pdField(data, 23, 20);
  const hot = pdField(data, 19, 16);
  const statusChange = pdBit(data, 25);
  em.detail(`Fixed Batteries [${pdRange(23, 20)}]`, statusChange
    ? (fixed ? `0b${fixed.toString(2).padStart(4, '0')} → 电池 ${batteryList(fixed, 0)}` : '无')
    : `0x${fixed.toString(16).toUpperCase()}（未置 Battery Status Change，此域 Reserved）`);
  em.detail(`Hot Swappable Batteries [${pdRange(19, 16)}]`, statusChange
    ? (hot ? `0b${hot.toString(2).padStart(4, '0')} → 电池 ${batteryList(hot, 4)}` : '无')
    : `0x${hot.toString(16).toUpperCase()}（未置 Battery Status Change，此域 Reserved）`);
  em.detail(`Reserved [${pdRange(15, 4)}]`, `0x${pdField(data, 15, 4).toString(16).toUpperCase()}`);

  const extType = pdField(data, 3, 0);
  em.detail(`Extended Alert Event Type [${pdRange(3, 0)}]`, pdBit(data, 31)
    ? `${extType} · ${EXT_ALERT_EVENT[extType] ?? '自定义/保留事件'}`
    : `0x${extType.toString(16).toUpperCase()}（未置 Extended Alert Event）`);

  let s = fired.length ? `告警：${fired.join('、')}` : '无告警位';
  if (pdBit(data, 31)) s += ` · 扩展事件：${EXT_ALERT_EVENT[extType] ?? `保留值 ${extType}`}`;
  if (statusChange && (fixed || hot)) {
    s += ` · 电池 ${batteryList(fixed, 0).concat(batteryList(hot, 4)).join('/')}`;
  }
  em.note(s);
  return s;
}

/** 位图 → 电池编号列表（前 4 位是固定电池 0-3，后 4 位是热插拔电池 4-7） */
function batteryList(mask, base) {
  const out = [];
  for (let i = 0; i < 4; i++) if (mask & (1 << i)) out.push(String(base + i));
  return out;
}

/* ══════════════════ Enter_USB（EUDO）══════════════════ */

function enterUsbParse(em, data) {
  const mode = pdField(data, 30, 28);
  const speed = pdField(data, 23, 21);
  const ctype = pdField(data, 20, 19);
  const ccur = pdField(data, 18, 17);

  em.detail(`Reserved [B31]`, pdBit(data, 31));
  em.detail(`USB Mode [${pdRange(30, 28)}]`, `${mode} · ${mode <= 2 ? USB_MODE[mode] : USB_MODE_UNKNOWN}`);
  em.detail(`Reserved [B27]`, pdBit(data, 27));
  em.detail('USB4 DRD [B26]', pdFlag(pdBit(data, 26), 'Host DFP 可作 USB4 Device', '否'));
  em.detail('USB3 DRD [B25]', pdFlag(pdBit(data, 25), 'Host DFP 可作 USB3 Device', '否'));
  em.detail(`Reserved [B24]`, pdBit(data, 24));
  em.detail(`Cable Speed [${pdRange(23, 21)}]`, `${speed} · ${speed <= 4 ? USB_SPEED[speed] : USB_SPEED_UNKNOWN}`);
  em.detail(`Cable Type [${pdRange(20, 19)}]`, ctype === 3 ? CABLE_TYPE[3] : `${ctype} · ${CABLE_TYPE[ctype]}`);
  em.detail(`Cable Current [${pdRange(18, 17)}]`, `${ccur} · ${CABLE_CURRENT_EUDO[ccur]}`);
  em.detail('PCIe Support [B16]', pdFlag(pdBit(data, 16), 'USB4 PCIe 隧道支持', '不支持'));
  em.detail('DP Support [B15]', pdFlag(pdBit(data, 15), 'USB4 DP 隧道支持', '不支持'));
  em.detail('TBT Support [B14]', pdFlag(pdBit(data, 14), '支持 Thunderbolt', '不支持'));
  em.detail('Host Present [B13]', pdFlag(pdBit(data, 13), 'USB 树顶存在 Host', '无 Host'));
  em.detail(`Reserved [${pdRange(12, 0)}]`, `0x${pdField(data, 12, 0).toString(16).toUpperCase()}`);

  const s = `${mode <= 2 ? USB_MODE[mode] : USB_MODE_UNKNOWN} · 线缆 ${ctype === 3 ? CABLE_TYPE[3] : CABLE_TYPE[ctype]}`
    + ` ${speed <= 4 ? USB_SPEED[speed] : USB_SPEED_UNKNOWN}`;
  em.note(s);
  return s;
}

/* ══════════════════ Source_Info（SIDO1 / SIDO2）══════════════════ */

function sourceInfoParse(em, data, idx) {
  if (idx === 0) {
    /* SIDO1：1W 步长 */
    const portType = pdBit(data, 31);
    em.object('Source_Info 数据对象 #1（SIDO1）');
    em.detail('Port Type [B31]', pdFlag(portType, 'Guaranteed Capability Port（供电能力固定）', 'Managed Capability Port（可动态调整）'));
    em.detail(`Reserved [${pdRange(30, 24)}]`, `0x${pdField(data, 30, 24).toString(16).toUpperCase()}`);
    em.detail(`Port Maximum PDP [${pdRange(23, 16)}]`, `${pdField(data, 23, 16)} W（1W 步长，端口最大能提供的功率）`);
    em.detail(`Port Present PDP [${pdRange(15, 8)}]`, `${pdField(data, 15, 8)} W（当前实际可提供，已扣除线缆/温度等限制）`);
    em.detail(`Port Reported PDP [${pdRange(7, 0)}]`, `${pdField(data, 7, 0)} W（Source_Capabilities 里报出的功率）`);
    const s = `最大 ${pdField(data, 23, 16)}W 当前 ${pdField(data, 15, 8)}W 报出 ${pdField(data, 7, 0)}W`;
    em.note(s);
    return s;
  }
  if (idx === 1) {
    /* SIDO2：0.5W 步长，带 DPS 位 */
    const portType = pdBit(data, 31);
    const dps = pdBit(data, 30);
    em.object('Source_Info 数据对象 #2（SIDO2）');
    em.detail('Port Type [B31]', pdFlag(portType, 'Guaranteed Capability Port', 'Managed Capability Port'));
    em.detail('DPS Port [B30]', pdFlag(dps, '动态电源（DPS），Port Type 应为 0b', '非 DPS'));
    em.detail(`Reserved [${pdRange(29, 18)}]`, `0x${pdField(data, 29, 18).toString(16).toUpperCase()}`);
    em.detail(`Port Maximum PDP [${pdRange(17, 9)}]`, `${pdNum(pdField(data, 17, 9) * 0.5)} W（0.5W 步长）`);
    em.detail(`Port Guaranteed PDP [${pdRange(8, 0)}]`, `${pdNum(pdField(data, 8, 0) * 0.5)} W（保证始终能提供的功率）`);
    const s = `最大 ${pdNum(pdField(data, 17, 9) * 0.5)}W 保证 ${pdNum(pdField(data, 8, 0) * 0.5)}W${dps ? ' · DPS' : ''}`;
    em.note(s);
    return s;
  }
  em.object(`Source_Info 数据对象 #${idx + 1}`);
  em.detail('原始值', `0x${pdHex(data)}`);
  return `Source_Info 数据对象 #${idx + 1}（规范只定义 2 个）`;
}

/* ══════════════════ Revision（RMDO）══════════════════ */

function revisionParse(em, data) {
  const rm = pdField(data, 31, 28), rn = pdField(data, 27, 24);
  const vm = pdField(data, 23, 20), vn = pdField(data, 19, 16);
  em.detail(`Revision Major [${pdRange(31, 28)}]`, String(rm));
  em.detail(`Revision Minor [${pdRange(27, 24)}]`, String(rn));
  em.detail(`Version Major [${pdRange(23, 20)}]`, String(vm));
  em.detail(`Version Minor [${pdRange(19, 16)}]`, String(vn));
  em.detail(`Reserved [${pdRange(15, 0)}]`, `0x${pdField(data, 15, 0).toString(16).padStart(4, '0').toUpperCase()}`);
  const s = `本端口支持的规范版本：Revision ${rm}.${rn} Version ${vm}.${vn}`;
  em.note(s);
  return s;
}

/* ══════════════════ EPR_Mode（EPRMDO）══════════════════ */

function eprModeParse(em, data, idx) {
  const action = pdField(data, 31, 24);
  const d = pdField(data, 23, 16);
  const actionText = EPR_MODE_ACTION[action] ?? '无效取值（接收端应忽略本条）';
  em.object(`EPR_Mode 数据对象 #${idx + 1}（EPRMDO）`);
  em.detail(`Action [${pdRange(31, 24)}]`, `0x${action.toString(16).padStart(2, '0').toUpperCase()} · ${actionText}`);
  let dText = `0x${d.toString(16).padStart(2, '0').toUpperCase()}`;
  if (action === 1) dText += ` · EPR Sink Operational PDP = ${d} W`;
  else if (action === 4) dText += ` · ${EPR_MODE_DATA[d] ?? `无效原因码 ${d}`}`;
  else dText += '（该 Action 下本域 Reserved）';
  em.detail(`Data [${pdRange(23, 16)}]`, dText);
  em.detail(`Reserved [${pdRange(15, 0)}]`, `0x${pdField(data, 15, 0).toString(16).padStart(4, '0').toUpperCase()}`);
  const s = actionText + (action === 4 ? ` · ${EPR_MODE_DATA[d] ?? `原因码 ${d}`}` : (action === 1 ? ` · PDP ${d}W` : ''));
  em.note(s);
  return s;
}

/* ══════════════════ Country_Code（CCDO）══════════════════ */

function countryCodeParse(em, data) {
  const first = pdField(data, 31, 24), second = pdField(data, 23, 16);
  const code = pdCharPair(first, second);
  em.object('Country Code 数据对象（CCDO）');
  em.detail(`First Character [${pdRange(31, 24)}]`, `0x${first.toString(16).padStart(2, '0').toUpperCase()} · ${String.fromCharCode(first)}`);
  em.detail(`Second Character [${pdRange(23, 16)}]`, `0x${second.toString(16).padStart(2, '0').toUpperCase()} · ${String.fromCharCode(second)}`);
  em.detail(`Reserved [${pdRange(15, 0)}]`, `0x${pdField(data, 15, 0).toString(16).padStart(4, '0').toUpperCase()}`);
  const s = `国家码 ${code}`;
  em.note(s);
  return s;
}

/* ══════════════════ Manufacturer_Info 字符串 ══════════════════ */

/** Manufacturer_Info 的 N…4 字节（0..21 字符，NUL 结尾） */
function manufacturerString(em, bytes) {
  const text = pdAscii(bytes);
  em.detail('Manufacturer String', text ? `"${text}"` : '（空）');
  em.note(text ? `厂商串 "${text}"` : '厂商串为空');
  return text;
}

/* ══════ src/js/pd/crc.js ══════ */
/**
 * crc.js — USB PD 报文尾部用的 CRC-32（与 zlib 同多项式 0xEDB88320，反射算法）
 *
 * 计算范围：Message Header（2 字节，小端）+ 全部 Data Object（各 4 字节，小端）。
 * 扩展消息则是 Message Header + Extended Message Header + 数据块（不足部分补 0）。
 *
 * 本文件是 `src/js/pd/` 独立 PD 解析库的一部分，零依赖。
 */

const TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

/**
 * @param {ArrayLike<number>} bytes
 * @returns {number} 32bit 无符号
 */
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* ══════ src/js/pd/decoder.js ══════ */
/**
 * decoder.js — USB Power Delivery 报文解码器（独立库的主入口）
 *
 * 流水线：BMC 解出的「比特序列」→ 4B5B 符号 → SOP 有序集 → 16bit Header
 *         → N×32bit Data Object → CRC32 → EOP → 逐对象语义解析。
 *
 * 与 ATK-C 官方上位机 / sigrok usb_power_delivery 的语义对齐，并在其基础上补齐：
 *   • SOP'/SOP'' 线缆链路的 VDM（plug 信令）——线缆 e-Marker 的 Discover Identity
 *     响应按 PD 3.2 Table 6.34…6.45 逐位还原（无源/有源线缆 VDO、VPD VDO、旧 AMA VDO）。
 *   • 扩展消息（Chapter 6.5）按数据块内的绝对字节号寻址，覆盖 SCEDB/SDB/GBCDB/
 *     制造商/安全/固件/PPS Status/国家码/SKEDB/ECDB/EPR 能力等，并处理分块拼接。
 *   • 跨版本差异：BIST 模式（PD 2.0 vs 3.x）、线缆最大 VBUS 电压码（3.0 vs 3.1+）、
 *     EPR 相关字段与消息类型的最低版本提示。
 *
 * 本文件属于 `src/js/pd/` 独立库：仅依赖同目录模块，浏览器 / Node 双栈通用，
 * 可整目录复制到别的工程复用（对外只暴露 PdDecoder 与若干解析函数）。
 */










/** 有序集名称 → 链路（'port' | 'cable'），用于 VDM/扩展消息判定方向与字段含义 */
const LINK_OF_SOP = {
  'SOP': 'port',
  "SOP'": 'cable',
  "SOP''": 'cable',
  "SOP' Debug": 'cable',
  "SOP'' Debug": 'cable',
  'Cable Reset': 'cable',
  'Hard Reset': 'port',
};

/** 控制消息的一句话说明（仅对需要解释的类型给出，其余留空） */
const CTRL_SUMMARY = {
  3: '接收请求',
  4: '拒绝请求',
  6: '电源就绪',
  9: '请求交换数据角色 (DR_Swap)',
  10: '请求交换电源角色 (PR_Swap)',
  11: '请求交换 VCONN 提供方 (VCONN_Swap)',
  12: '暂不能响应，稍后重试',
  13: '软复位：双方回到默认状态但保持供电',
  14: '数据复位',
  15: '数据复位完成',
  16: '不支持该请求',
  19: '快速角色交换请求',
};

/** 建立一份全新的解码状态（跨报文关联用） */
function createState() {
  return {
    pdos: { source: {}, sink: {} },   // 位置 → PDO 摘要文本（供 RDO / EPR_Request 反查）
    pdoMeta: { source: {}, sink: {} },// 位置 → PDO 元信息（kind 等）
    svidList: null,                   // 最近一次 Discover SVIDs 结果
    identity: null,                   // 最近一次 Discover Identity（端口/线缆）结果
    lastVdm: null,
    extCarry: null,                   // EPR 能力分块拼接的跨包尾巴
  };
}

class PdDecoder {
  /**
   * @param {{sampleRate:number}} opts
   */
  constructor({ sampleRate }) {
    this.sampleRate = sampleRate;
    this.reset();
  }

  /** 清空跨报文状态。切换通道 / 重新解码前调用。 */
  reset() {
    this.packetSeq = 0;
    this.st = createState();
    this.lastSopPowerRole = 'SRC';
  }

  /* ────────────────────────── 位 / 符号读取 ────────────────────────── */

  _sym(i) {
    const b = this.bits;
    if (i + 4 >= b.length) return 0x10;
    return DEC4B5B[(b[i] & 1) | ((b[i + 1] & 1) << 1) | ((b[i + 2] & 1) << 2)
      | ((b[i + 3] & 1) << 3) | ((b[i + 4] & 1) << 4)];
  }

  _byte() {
    const i = this.idx;
    if (this.bits.length - i <= 10) { this.warn('数据被截断', 'TRUNC'); return 0x0BAD; }
    const k0 = this._sym(i), k1 = this._sym(i + 5);
    this.idx += 10;
    return (k0 & 0x0F) | ((k1 & 0x0F) << 4);
  }

  _nibble() {
    if (this.bits.length - this.idx <= 5) { this.warn('数据被截断', 'TRUNC'); return 0x0BAD; }
    const s = this._sym(this.idx);
    if (s > 0xF) { this.warn(`非法 4B5B 符号 0x${s.toString(16).toUpperCase()}`, 'SYM'); return 0x0BAD; }
    this.idx += 5;
    return s;
  }

  _short() {
    if (this.bits.length - this.idx <= 20) { this.warn('报文被截断', 'TRUNC'); return 0x0BAD; }
    let val = 0;
    for (let i = 0; i < 4; i++) {
      const s = this._sym(this.idx + i * 5);
      if (s > 0xF) { this.warn(`非法 4B5B 符号 0x${s.toString(16).toUpperCase()}`, 'SYM'); return 0x0BAD; }
      val |= (s << (4 * i));      // 低 4bit 先行 → 小端
    }
    this.idx += 20;
    return val >>> 0;
  }

  _word() {
    const lo = this._short(), hi = this._short();
    if (lo === 0x0BAD || hi === 0x0BAD) { this.warn('读取 32bit 对象失败', 'WORD'); return 0x0BAD0BAD; }
    return ((hi << 16) | lo) >>> 0;
  }

  warn(longm, shortm) {
    if (this.warnings.length < 16) this.warnings.push({ long: longm, short: shortm });
  }

  /* ────────────────────────── SOP 扫描 ────────────────────────── */

  /**
   * 从比特流里找有序集。命中 4 个符号中的 3 个即认定为该有序集（容错），
   * 返回「Header 起始比特下标」；Hard Reset / Cable Reset 记入 specialPacket 并返回 -1。
   */
  _scanSop() {
    for (let i = 0; i + 19 < this.bits.length; i++) {
      const k = [this._sym(i), this._sym(i + 5), this._sym(i + 10), this._sym(i + 15)];
      let set = ORDERED_SET_BY_KEY[k.join()];
      if (!set) {
        const best = matchOrderedSet(k);
        if (best && best.matched >= 3) set = best.set;
      }
      if (!set) continue;

      this.sopBitOffset = i;
      if (set.name === 'Hard Reset' || set.name === 'Cable Reset') {
        this.specialPacket = set.name;
        this.packetSop = null;
        return -1;
      }
      this.packetSop = set.name;
      return i + 20;
    }
    this.warn('未找到报文起始有序集', 'NOSOP');
    return -1;
  }

  /* ────────────────────────── Header 字段 ────────────────────────── */

  headRevCode() { return (this.head >>> 6) & 3; }
  headRev() { return this.headRevCode() + 1; }              // 1…4（3.2 与 3.1 同码）
  headRevText() { return SPEC_REV[this.headRevCode()]; }     // '1.0' | '2.0' | '3.x' | 'Reserved（11b）'
  /** PD 3.0（码 2）起才有 Extended 位与 5bit Message Type */
  headModern() { return this.headRevCode() >= 2; }
  headExt() { return this.headModern() ? ((this.head >>> 15) & 1) : 0; }
  headId() { return (this.head >>> 9) & 7; }
  headPowerRole() { return (this.head >>> 8) & 1; }
  headDataRole() { return (this.head >>> 5) & 1; }
  headCount() { return (this.head >>> 12) & 7; }
  headType() { return this.headModern() ? (this.head & 0x1F) : (this.head & 0x0F); }

  /* ────────────────────────── 详情发射器 ────────────────────────── */

  _makeEmitter() {
    const self = this;
    return {
      object(title) { self.details.push({ key: 'Object', value: String(title) }); },
      detail(key, value) { self.details.push({ key: String(key), value: String(value) }); },
      note(text) { if (text != null && text !== '') self.summaryParts.push(String(text)); },
    };
  }

  /* ────────────────────────── 主入口 ────────────────────────── */

  /**
   * @param {{bits:number[], edges:number[], startSample:number, endSample:number, bitrate:number}} raw
   * @param {number} channel
   * @returns {object|null}
   */
  decode(raw, channel = 0) {
    this.bits = raw.bits;
    this.idx = 0;
    this.warnings = [];
    this.details = [];
    this.summaryParts = [];
    this.dataWords = [];
    this.text = '';
    this.specialPacket = null;
    this.packetSop = null;
    this.sopBitOffset = -1;
    this.crcExtra = null;
    this.dataBytesOverride = null;
    this.packetRaw = raw;
    this.channel = channel;
    this.em = this._makeEmitter();

    const hdrIdx = this._scanSop();

    if (hdrIdx < 0 && this.specialPacket) return this._specialPacket(raw, channel);
    if (hdrIdx < 0) return null;

    this.packetSeq++;
    const tms = raw.startSample / this.sampleRate * 1000;
    this.text = `#${this.packetSeq} (${tms.toFixed(4)}ms): `;
    this.idx = hdrIdx;
    this.head = this._short();
    if (this.head === 0x0BAD) return null;

    const t = this.headType();
    const isExt = this.headExt() === 1;
    const nObjects = this.headCount();

    let shortm;
    if (isExt) shortm = EXT_TYPES[t] ?? `EXT?${t}`;
    else if (nObjects === 0) shortm = CTRL_TYPES[t] ?? `CTRL?${t}`;
    else shortm = DATA_TYPES[t] ?? `DATA?${t}`;

    const link = LINK_OF_SOP[this.packetSop] ?? 'port';
    const role = this._resolveRole(link);
    this.resolvedRole = role;

    const longm = `(r${this.headRev()}) ${role}[${this.headId()}]: ${shortm}`;
    this.text += longm;

    /* 版本合法性提示 */
    this._versionHints(t, isExt, nObjects, shortm);

    /* 载荷 */
    let extHeader = null;
    let nObj = nObjects;
    let crc, calc, crcOk;
    if (isExt) {
      // 扩展消息的载荷长度不能采信 Header 的计数位（见 _readExtended 注释），
      // 由 _readExtended 内部连同 CRC 一起定长读出。
      const r = this._readExtended(t, link);
      extHeader = r.extHead;
      nObj = r.objCount;
      crc = r.crc; calc = r.calc; crcOk = r.crcOk;
    } else {
      // 先把全部数据对象读进来：VDM 等类型需要「整条报文」才能解析（例如 Discover Identity
      // 的 VDO 链要按顺序配对），不能边读边解析。
      for (let i = 0; i < nObjects; i++) this.dataWords.push(this._word());
      if (t === 15) {
        this._vdm(link);
      } else {
        for (let i = 0; i < nObjects; i++) this._payload(i, t, link);
      }
      if (nObjects === 0 && CTRL_SUMMARY[t]) this.summaryParts.push(CTRL_SUMMARY[t]);

      /* CRC + EOP */
      crc = this._word();
      calc = this._computeCrc();
      crcOk = crc === calc;
    }
    if (!crcOk) this.warn(`CRC 校验失败：读到的 0x${pdHex(crc)} ≠ 计算的 0x${pdHex(calc)}`, 'CRC');

    let eop = false;
    if (this.bits.length >= this.idx + 5 && this._sym(this.idx) === SYM_EOP) { eop = true; this.idx += 5; }
    else this.warn('缺少 EOP（报文结束符）', 'EOP');

    return this._finish(raw, channel, {
      sop: this.packetSop,
      msgType: shortm,
      msgTypeRaw: t,
      msgKind: isExt ? 'ext' : (nObjects === 0 ? 'control' : 'data'),
      role,
      header: this.head,
      extHeader,
      msgId: this.headId(),
      rev: this.headRev(),
      revText: this.headRevText(),
      powerRole: this.headPowerRole(),
      dataRole: this.headDataRole(),
      link,
      nObjects: nObj,
      crc,
      crcCalc: calc,
      crcOk,
      eop,
      category: MSG_CATEGORY[shortm] ?? (isExt ? 'data' : 'control'),
    });
  }

  /** 方向：与官方上位机的三值口径一致（SRC / SNK / Plug），细节另放字段 */
  _resolveRole(link) {
    const ppr = this.headPowerRole();
    const dr = this.headDataRole();
    if (this.packetSop === 'SOP') {
      const role = ppr ? 'SRC' : 'SNK';
      this.lastSopPowerRole = role;
      return role;
    }
    if (link === 'cable') return ppr ? 'Plug' : this.lastSopPowerRole;
    return this.lastSopPowerRole;
  }

  /**
   * 版本合法性提示。
   * Header 的修订号只能表示到「3.x」，所以「3.1 才定义的报文」出现在 r3 包里**不是错误**，
   * 只能用一句说明带过；只有连 3.x 都够不着的（如 PD 2.0 包里出现 3.0 才有的类型）才报警告。
   */
  _versionHints(t, isExt, nObjects, shortm) {
    const revText = this.headRevText();
    if (revText.startsWith('Reserved')) {
      this.warn('Header 的 Specification Revision 是保留值 11b（规范规定不得使用），版本判定不可靠', 'REV');
      return;
    }
    // 规范：00b（Revision 1.0）已废弃，接收端一律按 Revision 2.0 解读
    const legacy1 = this.headRevCode() === 0;
    const revNum = legacy1 ? 2.0 : revTextNum(revText);
    if (legacy1 && nObjects > 0) {
      this.summaryParts.push('（Revision 域为 00b：已废弃，按 Revision 2.0 解读）');
    }
    const min = isExt ? EXT_MIN_REV[t] : (nObjects === 0 ? CTRL_MIN_REV[t] : DATA_MIN_REV[t]);
    if (min !== undefined && revNum + 1e-9 < min) {
      if (revText === '3.x' && min <= 3.2) {
        this.summaryParts.push(`（「${shortm}」自 PD ${min.toFixed(1)} 起定义；报文头只能标到 3.x，无法区分 3.0/3.1/3.2）`);
      } else {
        this.warn(`消息类型「${shortm}」自 PD ${min.toFixed(1)} 起才定义，本包声明为 r${this.headRev()}`, 'REV');
      }
    }
    if (!isExt && nObjects === 0 && CTRL_DEPRECATED[shortm]) {
      this.warn(`${shortm}：${CTRL_DEPRECATED[shortm]}`, 'DEPR');
    }
  }

  _computeCrc() {
    const headBytes = [this.head & 0xFF, (this.head >>> 8) & 0xFF];
    if (this.crcExtra) return crc32(headBytes.concat(this.crcExtra));
    const bytes = headBytes.slice();
    for (const w of this.dataWords) bytes.push(w & 0xFF, (w >>> 8) & 0xFF, (w >>> 16) & 0xFF, (w >>> 24) & 0xFF);
    return crc32(bytes);
  }

  /* ────────────────────────── 载荷解析 ────────────────────────── */

  _payload(idx, t, link) {
    const em = this.em;
    const data = this.dataWords[idx];
    const ctx = {
      rev: this.headRev(), revText: this.headRevText(),
      sop: this.packetSop, link, role: this.resolvedRole,
    };
    let summary = '';

    if (t === 2) {
      rdoParse(this.st, em, data, { isEpr: false });
    } else if (t === 1 || t === 4) {
      const role = t === 1 ? 'source' : 'sink';
      const r = pdoParse(this.st, em, data, { role, position: idx + 1, isEpr: false, revText: ctx.revText });
      em.note(r.summary);
    } else if (t === 9) {
      if (idx === 0) {
        rdoParse(this.st, em, data, { isEpr: true });
      } else {
        const r = pdoParse(this.st, em, data, { role: 'source', position: idx + 1, isEpr: true, revText: ctx.revText });
        em.note(`EPR 能力副本 #${idx} · ${r.summary}`);
      }
    } else if (t === 15) {
      // VDM 需要整条报文，由 decode() 统一调用 _vdm()，不会走到这里
      this._vdm(link);
    } else if (t === 3) {
      summary = bistParse(em, data, idx, ctx);
    } else if (t === 10) {
      summary = eprModeParse(em, data, idx);
    } else if (t === 5) {
      em.object('Battery_Status 数据对象（BSDO）');
      summary = batteryStatusParse(em, data);
    } else if (t === 6) {
      summary = alertParse(em, data, idx);
    } else if (t === 8) {
      em.object('Enter_USB 数据对象（EUDO）');
      summary = enterUsbParse(em, data);
    } else if (t === 11) {
      summary = sourceInfoParse(em, data, idx);
    } else if (t === 12) {
      em.object('Revision 数据对象（RMDO）');
      summary = revisionParse(em, data);
    } else if (t === 7) {
      summary = countryCodeParse(em, data);
    } else {
      em.object(`数据对象 #${idx + 1}`);
      em.detail('原始值', `0x${pdHex(data)}`);
      summary = `0x${pdHex(data)}`;
      em.note(summary);
    }
    this.text += ` - ${summary}`;
  }

  /** VDM：把整条报文的全部数据对象交给 vdmParse（含 plug 信令的线缆 VDO） */
  _vdm(link) {
    if (!this.dataWords.length) { this.em.note('VDM 未携带数据对象'); return; }
    const ctx = {
      rev: this.headRev(), revText: this.headRevText(),
      sop: this.packetSop, link, role: this.resolvedRole,
    };
    vdmParse(this.st, this.em, this.dataWords, ctx);
  }

  /* ────────────────────────── 扩展消息 ────────────────────────── */

  /**
   * 读扩展消息：扩展头 → 数据块 → CRC，并把整块交给 extendedParse 做语义解析。
   *
   * 长度为什么不能直接信 Header？
   *   Table 6.3 规定：Extended=1 且 Chunked=0 时，Header 里的 Number of Data Objects 是
   *   **保留位，接收方必须忽略**；长度只能由扩展头的 Data Size 决定。
   *   而 Data Size 的解读还要分两种：
   *     • Chunked=1 —— Data Size 是「整个数据块」的总字节数，本块从 chunkNum×MaxChunkLen 起；
   *       且载荷要补齐到 4 字节边界（补 00h），补齐字节计入 CRC；
   *     • Chunked=0 —— Data Size 就是本消息的全部数据字节数，**不做补齐**（补齐只针对分块消息）。
   *
   * 实际抓包里各家实现并不完全一致（例如苹果会在非分块扩展消息里把计数位填 0，
   * 也有实现会多补几个 00h），所以这里对「补 / 不补」两种长度都试一遍，用 CRC 反证挑出正确的那份；
   * 都不过 CRC 时退回规范读法并如实报警，不猜。
   *
   * @returns {{extHead:number, objCount:number, crc:number, calc:number, crcOk:boolean}}
   */
  _readExtended(t, link) {
    const extHead = this._short();
    const chunked = !!((extHead >>> 15) & 1);
    const chunkNum = (extHead >>> 11) & 0x0F;
    const reqChunk = !!((extHead >>> 10) & 1);
    const dataSize = extHead & 0x1FF;

    this.extHeadInfo = { chunked, chunkNum, reqChunk, dataSize };

    const hdrBytes = [this.head & 0xFF, (this.head >>> 8) & 0xFF];
    const extBytes = [extHead & 0xFF, (extHead >>> 8) & 0xFF];
    const cands = this._extCandidates({ chunked, chunkNum, reqChunk, dataSize });

    let pick = null;
    for (const c of cands) {
      const r = this._readExtTry(c, hdrBytes, extBytes);
      if (r.ok) { pick = r; break; }
      if (!pick) pick = r;                    // 都不匹配时用第一个候选兜底
    }
    if (!pick.ok) pick = this._readExtTry(cands[0], hdrBytes, extBytes);   // 让 idx 停在正确位置

    const { payload, pad, bytes } = pick;
    const payloadBytes = bytes.slice(0, payload);

    // 线上真实字节 = 扩展头(2) + 数据块(+补齐)。非分块扩展消息不补齐时，
    // 总长 % 4 != 0（如 Data Size=25 → 27 字节），末个「数据对象」只占 3 字节。
    const body = extBytes.concat(bytes);
    // 「数据对象 (hex)」一栏：按 4 字节回填，让界面与其它消息一致地显示原始字节。
    // 末组不足 4 字节时补 0 只为凑齐对象视图，真实字节另由 dataBytesOverride 给出。
    for (let i = 0; i < body.length; i += 4) {
      this.dataWords.push((body[i] | ((body[i + 1] ?? 0) << 8)
        | ((body[i + 2] ?? 0) << 16) | ((body[i + 3] ?? 0) << 24)) >>> 0);
    }
    this.dataBytesOverride = body;

    const ctx = { rev: this.headRev(), revText: this.headRevText(), sop: this.packetSop, link, sopName: this.packetSop };
    const bk = {
      bytes: payloadBytes, off: pick.off, dataSize, chunked, chunkNum, reqChunk,
      _carry: this.st.extCarry,
    };

    const em2 = this.em;
    const s = extendedParse(this.st, em2, t, bk, ctx);
    this.st.extCarry = bk._tail ?? null;
    if (s) em2.note(s);
    if (pick.off > 0 && !bk._tail) em2.detail('说明', `本包是分块数据的第 ${chunkNum + 1} 块（从整块偏移 ${pick.off} 字节处开始）`);

    return {
      extHead,
      objCount: Math.ceil((2 + payload + pad) / 4),
      crc: pick.crc, calc: pick.calc, crcOk: pick.ok,
    };
  }

  /** 按「(数据字节数, 补齐字节数, 整块偏移)」列出可尝试的几种读法，顺序即优先级 */
  _extCandidates({ chunked, chunkNum, reqChunk, dataSize }) {
    const out = [];
    if (reqChunk) return [{ payload: 0, pad: 0, off: 0 }];        // 请求分块：Data Size 必为 0
    if (chunked) {
      const cap = Math.max(this.headCount() * 4 - 2, 0);          // 分块消息的计数位有效，用它定本块长度
      const off = chunkNum * EXT_MSG_LIMITS.chunkLen;
      const payload = Math.min(Math.max(dataSize - off, 0), cap);
      return [{ payload, pad: Math.max(cap - payload, 0), off }];
    }
    const size = Math.min(dataSize, EXT_MSG_LIMITS.maxLen);
    out.push({ payload: size, pad: 0, off: 0 });                 // 规范读法：非分块不补齐
    const padded = Math.max(Math.ceil((2 + size) / 4) * 4 - 2, 0);
    if (padded > size) out.push({ payload: size, pad: padded - size, off: 0 });   // 兼容补齐 00h 的发送方
    if (size > 0) out.push({ payload: Math.max(size - 3, 0), pad: 0, off: 0 });   // 兼容少补的发送方
    return out;
  }

  /** 试读一种长度：读数据块 + CRC，比对成功返回 ok；失败把 idx 与警告回滚，便于换一种再试 */
  _readExtTry(cand, hdrBytes, extBytes) {
    const saveIdx = this.idx;
    const saveWarn = this.warnings.length;
    const n = cand.payload + cand.pad;
    const bytes = new Array(n);
    for (let i = 0; i < n; i++) bytes[i] = this._byte();
    const crc = this._word();
    const calc = crc32(new Uint8Array(hdrBytes.concat(extBytes, bytes)));
    const ok = crc === calc;
    if (!ok) { this.idx = saveIdx; this.warnings.length = saveWarn; }
    return { ...cand, bytes, crc, calc, ok };
  }

  /* ────────────────────────── 特殊短报文 ────────────────────────── */

  _specialPacket(raw, channel) {
    this.packetSeq++;
    const tms = raw.startSample / this.sampleRate * 1000;
    this.text = `#${this.packetSeq} (${tms.toFixed(4)}ms): ${this.specialPacket}`;
    return this._finish(raw, channel, {
      sop: this.specialPacket,
      msgType: this.specialPacket,
      msgTypeRaw: null,
      msgKind: 'special',
      role: this.lastSopPowerRole,
      header: null,
      extHeader: null,
      msgId: null,
      rev: null,
      revText: null,
      powerRole: null,
      dataRole: null,
      link: LINK_OF_SOP[this.specialPacket] ?? 'port',
      nObjects: 0,
      crc: null,
      crcCalc: null,
      crcOk: null,
      eop: null,
      summary: this.specialPacket === 'Hard Reset'
        ? '硬复位：发送方要求链路立即回到默认状态并重新建链'
        : '线缆复位：复位线缆 e-Marker 的 VCONN 相关逻辑',
      category: 'control',
    });
  }

  /* ────────────────────────── 组装 packet ────────────────────────── */

  _finish(raw, channel, o) {
    const summary = this.summaryParts.filter(Boolean).join(' ; ');
    if (summary) this.text += ` - ${summary}`;

    let bytes;
    if (this.dataBytesOverride) {
      bytes = this.dataBytesOverride.slice();      // 扩展消息：线上真实字节（可能不是 4 的整数倍）
    } else {
      bytes = [];
      for (const w of this.dataWords) bytes.push(w & 0xFF, (w >>> 8) & 0xFF, (w >>> 16) & 0xFF, (w >>> 24) & 0xFF);
    }

    return {
      seq: this.packetSeq,
      channel,
      ...o,
      summary,
      startSample: raw.startSample,
      endSample: raw.endSample,
      timeMs: raw.startSample / this.sampleRate * 1000,
      endTimeMs: raw.endSample / this.sampleRate * 1000,
      durationUs: (raw.endSample - raw.startSample) / this.sampleRate * 1e6,
      bitrate: raw.bitrate,
      dataWords: this.dataWords.slice(),
      dataBytes: bytes,
      dataHex: bytes.map((b) => b.toString(16).padStart(2, '0').toUpperCase()).join(' '),
      details: this.details,
      warnings: this.warnings.slice(),
      text: this.text,
    };
  }
}

/**
 * pipeline.js — 把 .atkcc 变成 PD 报文列表的完整流水线
 *
 *   解压分块 -> 位流(1bit/采样) -> BMC 边沿状态机 -> 4B5B/PD 解析 -> 报文对象
 *
 * 全程流式处理，逐块回调进度，支持中断（长抓包可随时停止）。
 */





/**
 * @param {AtkccCapture} capture
 * @param {number} channel
 * @param {{inflate:Function, onProgress?:Function, shouldStop?:()=>boolean, sampleRate?:number}} opts
 * @returns {Promise<{packets:object[], stats:object}>}
 */
async function decodeChannel(capture, channel, opts) {
  const { inflate, onProgress, shouldStop } = opts;
  const ch = capture.meta.channelMap.get(channel);
  if (!ch) throw new Error(`通道 ${channel} 不存在`);

  // 采样率不是写死的：先看文件声明，再用波形节拍核对 / 兜底（同一份文件只测一次）
  const rate = await resolveSampleRate(capture, channel, inflate, { shouldStop, sampleRate: opts.sampleRate });
  const sampleRate = rate.rate;

  const bmc = new BmcDecoder({ sampleRate });
  const pd = new PdDecoder({ sampleRate });
  const ex = new EdgeExtractor({ bitOrder: opts.bitOrder || 'lsb' });
  const packets = [];

  const limit = capture.effectiveSampleLimit(channel);
  let sampleBase = 0;
  let trimmed = 0;
  let edges = 0;

  const emit = (raw) => {
    edges += raw.edges.length;
    const pkt = pd.decode(raw, channel);
    if (pkt) packets.push(pkt);
  };

  for (let i = 0; i < ch.chunks.length; i++) {
    if (shouldStop?.()) break;
    let data = await capture.readChunk(channel, i, inflate);
    if (!data) continue;

    const isLast = i === ch.chunks.length - 1;
    let keep = data.length;
    if (limit > 0) {
      const remainBytes = Math.ceil((limit - sampleBase) / 8);
      if (remainBytes < keep) keep = Math.max(0, remainBytes);
    }
    if (isLast) {
      const t = AtkccCapture.trimTrailingZeros(data);
      if (t < keep) { trimmed += keep - t; keep = t; }
    }
    data = data.subarray(0, keep);

    ex.push(data, sampleBase, (edge) => {
      const p = bmc.pushEdge(edge);
      if (p) emit(p);
    });
    sampleBase += data.length * 8;

    onProgress?.({
      channel,
      chunk: i + 1,
      chunks: ch.chunks.length,
      ratio: (i + 1) / ch.chunks.length,
      packets: packets.length,
      samples: sampleBase,
    });

    // 让出主线程，避免长任务卡死 UI
    if ((i & 7) === 7) await new Promise((r) => setTimeout(r, 0));
  }

  // 收尾：补一个虚拟边沿，让最后一个包也能落地
  if (!shouldStop?.()) {
    ex.flush((edge) => {
      const p = bmc.pushEdge(edge, true);
      if (p) emit(p);
    }, bmc.maxbit + 1);
  }

  // 按采样点排序，并分配序号
  packets.sort((a, b) => a.startSample - b.startSample);
  packets.forEach((p, i) => { p.index = i; });

  // 建立 GOOD CRC → 被确认报文的对应关系（供界面「同色配对」及导出使用）
  linkGoodCrc(packets);

  return {
    packets,
    stats: {
      channel,
      totalSamples: sampleBase,
      durationSec: sampleBase / sampleRate,
      sampleRate,
      sampleRateSource: rate.source,          // declared | measured | default | override
      sampleRateDeclared: rate.declared,
      sampleRateMeasured: rate.measured ?? null,
      sampleRateNote: rate.note ?? null,      // 与声明值不一致时给界面一句人话解释
      edges,
      trimmedBytes: trimmed,
      packetCount: packets.length,
      badCrc: packets.filter((p) => p.crcOk === false).length,
      warnings: packets.reduce((s, p) => s + (p.warnings?.length ?? 0), 0),
    },
  };
}

// ── 采样率：声明 → 波形自检 → 兜底 ───────────────────────────────────

/**
 * 声明值与波形实测的最大允许偏差。超出这个比例才认为「文件写的采样率不可信」。
 *
 * 为什么门槛这么宽（±25%）而不是 5%？因为 PD 标称的 600 kHz BMC 时钟只是**标称**：
 * 用波形节拍反推的采样率与文件声明的 2.5 MHz 之间，实测 5 份不同厂商的抓包都稳定
 * 偏低约 4%（器件时钟与标称值的正常离散）。而文件声明的采样率才是「采样点序号 → 时间」
 * 的换算依据（用它算出来的时标与官方上位机逐字段一致），所以只要两者量级相符就以声明为准。
 */
const RATE_TOLERANCE = 0.25;

const fmtHz = (hz) => `${(hz / 1e6).toFixed(3).replace(/\.?0+$/, '')} MHz`;

/**
 * 只用波形的游程分布反推采样率 —— 只读最前面 1~2 个块，量级几十毫秒。
 * @returns {Promise<null|{sampleRate:number, uiSamples:number, confidence:number}>}
 */
async function probeSampleRate(capture, channel, inflate, { maxChunks = 2, maxRuns = 40000, shouldStop } = {}) {
  const ch = capture.meta.channelMap.get(channel);
  if (!ch) return null;
  let runs = [];
  for (let i = 0; i < Math.min(maxChunks, ch.chunks.length); i++) {
    if (shouldStop?.()) break;
    const data = await capture.readChunk(channel, i, inflate);
    if (!data) continue;
    runs = runs.concat(collectRunStats(data, { maxRuns: Math.max(0, maxRuns - runs.length) }));
    if (runs.length >= maxRuns) break;
  }
  return estimateSampleRate(runs);
}

/**
 * 决定这份抓包用哪个采样率把「采样点序号」换算成时间。三级策略，越靠前越优先：
 *
 *   ① **文件声明**（`channel.ini`）—— 5 份真实抓包都声明 2500 kHz，且据此算出的时标
 *      与官方 ATK-C 截图逐字段一致，所以它是首选。
 *   ② **波形自检** —— 用 BMC 游程反推（`estimateSampleRate`）。只有当 ① 缺失，或 ① 与
 *      波形相差超过 ±RATE_TOLERANCE 时才推翻 ①。这样遇到「别的采样率」「单位写错」
 *      「压根没写」的文件也能解，而正常文件的行为一字不变。
 *   ③ **兜底** `DEFAULT_SAMPLE_RATE`（2.5 MHz）。
 *
 * 结果会缓存到 capture 上：同一份文件切换通道时不重复测。
 *
 * @returns {Promise<{rate:number, source:'declared'|'measured'|'default'|'override',
 *                    declared:number, measured:number|null, note:string|null, cached?:boolean}>}
 */
async function resolveSampleRate(capture, channel, inflate, opts = {}) {
  const declared = capture.meta.sampleRate;
  const declaredSource = capture.meta.sampleRateSource || 'default';

  if (opts.sampleRate > 0) {
    return { rate: opts.sampleRate, source: 'override', declared, measured: null,
      note: `采样率由调用方指定为 ${fmtHz(opts.sampleRate)}（文件声明 ${fmtHz(declared)}）` };
  }

  capture._rateCache ||= new Map();
  if (capture._rateCache.has(channel)) return capture._rateCache.get(channel);

  const measured = await probeSampleRate(capture, channel, inflate, opts);
  const info = {
    declared,
    declaredSource,
    measured: measured?.sampleRate ?? null,
    measuredUi: measured?.uiSamples ?? null,
    confidence: measured?.confidence ?? 0,
    declaredText: capture.meta.sampleRateRaw || null,
  };

  let out;
  if (!measured) {
    // 波形认不出来（比如通道是空的、或数据不是 PD）→ 保持声明值/兜底值
    out = { ...info, rate: declared, source: declaredSource, note: null };
  } else {
    const ratio = measured.sampleRate / declared;
    if (declaredSource === 'declared' && ratio >= 1 - RATE_TOLERANCE && ratio <= 1 + RATE_TOLERANCE) {
      out = { ...info, rate: declared, source: 'declared', ratio, note: null };     // 一致 → 信文件
    } else if (declaredSource === 'default') {
      out = { ...info, rate: measured.sampleRate, source: 'measured', ratio,
        note: `文件未声明采样率，按波形节拍取 ${fmtHz(measured.sampleRate)}` };
    } else {
      out = { ...info, rate: measured.sampleRate, source: 'measured', ratio,
        note: `文件声明 ${fmtHz(declared)} 与波形节拍（${fmtHz(measured.sampleRate)}）相差过大，已按实测值解码` };
    }
  }
  capture._rateCache.set(channel, out);
  return out;
}

// ── GOOD CRC 配对 ────────────────────────────────────────────────────

/**
 * 给每条 GOOD CRC 找出「它所确认的那条报文」，写入：
 *   p.ackOf   —— 被确认报文的序号（packets 下标）
 *   p.ackType —— 被确认报文的类型名（便于展示）
 *
 * 判据来源：
 *   ① **紧邻性**——GoodCRC 是对报文的即时应答，必然落在被确认报文之后最近处。
 *      向前找最近一条「非 GOOD CRC 且方向相反」的报文，即物理上唯一合理的对象。
 *      这一条也能覆盖 Hard Reset / Cable Reset 这类没有 MessageID 的报文。
 *   ② **MessageID**——PD 规范要求 GoodCRC 的 MessageID 与被确认报文相同。
 *      用它校验 ①；若邻近报文 CRC 完好却 ID 对不上（说明中间夹了别的方向的报文），
 *      再向后找同 ID 的那条。找不到仍按邻近关系配对。
 *
 * 注意不能只用 ②：被确认报文本身是坏包时 MessageID 不可信，若拿它去查
 * 「最近登记的同 ID 报文」，会误配到几十条报文之前的一条陈旧记录上。
 * 坏掉的 GOOD CRC 不参与配对（保持错误标识，便于定位）。
 */
const ACK_WINDOW = 16;   // 向前搜索窗口（条）
function linkGoodCrc(packets) {
  const pick = (p, needId) => {
    for (let j = p.index - 1; j >= 0 && j > p.index - ACK_WINDOW; j--) {
      const q = packets[j];
      if (q.msgType === 'GOOD CRC' || q.role === p.role) continue;
      if (needId && q.crcOk !== false && q.msgId !== p.msgId) continue;
      return q;
    }
    return null;
  };
  for (const p of packets) {
    if (p.msgType !== 'GOOD CRC' || p.crcOk === false) continue;
    let ref = pick(p, false);
    if (!ref) continue;
    // 邻近报文 CRC 完好但 MessageID 对不上 → 改按 MessageID 精确匹配
    if (ref.crcOk !== false && ref.msgId !== p.msgId) ref = pick(p, true) || ref;
    p.ackOf = ref.index;
    p.ackType = ref.msgType;
  }
}

// ── bus.ini 模拟量轨迹 ────────────────────────────────────────────────

/** 取某个采样点处的 VBUS/IBUS（阶梯保持） */
function busAt(bus, sample) {
  if (!bus || !bus.length) return { vbus: 0, ibus: 0 };
  let lo = 0, hi = bus.length - 1, ans = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (bus[mid].sample <= sample) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return bus[ans];
}

/**
 * 把 bus.ini 展开成等间隔序列，用于画图。
 * @returns {{t0:number, dt:number, vbus:Float64Array, ibus:Float64Array, min:number, max:number, vmax:number, imax:number}}
 */
function buildBusSeries(bus, totalSamples, sampleRate, targetPoints = 3000) {
  if (!bus || !bus.length) {
    return { t0: 0, dt: 0, vbus: new Float64Array(0), ibus: new Float64Array(0), vmax: 0, imax: 0 };
  }
  const step = Math.max(1, Math.floor(totalSamples / targetPoints));
  const n = Math.floor(totalSamples / step) + 1;
  const vbus = new Float64Array(n);
  const ibus = new Float64Array(n);
  let vmax = 0, imax = 0;
  let j = 0;
  for (let i = 0; i < n; i++) {
    const s = i * step;
    while (j + 1 < bus.length && bus[j + 1].sample <= s) j++;
    vbus[i] = bus[j].vbus;
    ibus[i] = bus[j].ibus;
    if (vbus[i] > vmax) vmax = vbus[i];
    if (ibus[i] > imax) imax = ibus[i];
  }
  return { t0: 0, step, n, vbus, ibus, vmax, imax, sampleRate };
}

/** 取一段采样区间内的原始电平，用于波形视图（压缩为 min/max 包络） */
async function readWaveform(capture, channel, inflate, startSample, endSample, maxPoints = 1200) {
  const ch = capture.meta.channelMap.get(channel);
  if (!ch) return null;
  const startByte = Math.floor(startSample / 8);
  const endByte = Math.min(Math.ceil(endSample / 8), ch.totalBytes);
  const firstChunk = Math.floor(startByte / 1048576);
  const lastChunk = Math.floor((endByte - 1) / 1048576);

  const span = Math.max(1, endSample - startSample);
  const bucket = Math.max(1, Math.ceil(span / maxPoints));
  const points = [];
  let cur = { s: startSample, hi: 0, lo: 1 };

  const consumeRun = (level, len, sample) => {
    // 把一段电平塞进桶里
    let bucketIdx = Math.floor((sample - startSample) / bucket);
    // 简化：只记录该桶内是否出现过高低
    if (bucketIdx >= maxPoints) bucketIdx = maxPoints - 1;
    while (points.length <= bucketIdx) {
      points.push({ s: startSample + points.length * bucket, hi: 0, lo: 1 });
    }
    const p = points[bucketIdx];
    if (level) p.hi = 1; else p.lo = 0;
  };

  for (let ci = firstChunk; ci <= lastChunk; ci++) {
    const data = await capture.readChunk(channel, ci, inflate);
    if (!data) continue;
    const chunkBase = ci * 1048576 * 8;
    for (let b = 0; b < data.length; b++) {
      const bitBase = chunkBase + b * 8;
      if (bitBase + 8 <= startSample || bitBase >= endSample) continue;
      const byte = data[b];
      if (byte === 0xFF) { consumeRun(1, 8, bitBase); continue; }
      if (byte === 0x00) { consumeRun(0, 8, bitBase); continue; }
      for (let k = 0; k < 8; k++) {          // LSB 优先：bit0 时间最早
        const bit = (byte >> k) & 1;
        const s = bitBase + k;
        if (s < startSample || s >= endSample) continue;
        consumeRun(bit, 1, s);
      }
    }
  }
  return { points, bucket, startSample, endSample, sampleRate: capture.meta.sampleRate };
}

/* ══════ src/js/core/inflate.js ══════ */
/**
 * inflate.js — 环境自适应的 raw deflate 解压
 *
 * 浏览器 / 桌面外壳的 WebView：DecompressionStream('deflate-raw')
 * Node：node:zlib
 *
 * 对外只暴露一个 makeInflator() -> (raw, expectedSize) => Promise<Uint8Array>
 */

/** 浏览器实现（Chrome/Edge 103+ / Safari 16.4+ / Firefox 113+；桌面外壳的 WebView 也走这条） */
function makeBrowserInflator() {
  const supported = typeof DecompressionStream === 'function';
  return async function inflateRaw(raw, expectedSize) {
    if (expectedSize === 0) return new Uint8Array(0);
    if (!supported) throw new Error('当前环境不支持 DecompressionStream');
    // 拷贝一份，避免 subarray 视图被流式读取时被回收
    const input = raw.slice();
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([input]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new Uint8Array(buf);
  };
}

/** Node 实现 */
async function makeNodeInflator() {
  const zlib = await import('node:zlib');
  return function inflateRaw(raw, expectedSize) {
    const out = zlib.inflateRawSync(Buffer.from(raw.buffer, raw.byteOffset, raw.byteLength));
    if (expectedSize && out.length !== expectedSize) {
      // 尺寸不符时仍然返回，交由上层判断
      return new Uint8Array(out.buffer, out.byteOffset, out.length);
    }
    return new Uint8Array(out.buffer, out.byteOffset, out.length);
  };
}

/** 自动挑选实现 */
async function makeAutoInflator() {
  const isNode = typeof process !== 'undefined' && process.versions && process.versions.node
    && typeof window === 'undefined';
  if (isNode) return await makeNodeInflator();
  return makeBrowserInflator();
}

/**

 * 都是运行期事实，因此同一份 dist/PDScope.html 丢到哪儿都能正确自适应。
 */
const ENV = (() => {
  const proto = location.protocol;
  // Tauri v2 会注入 __TAURI_INTERNALS__；__TAURI__ 只在开了 withGlobalTauri 时出现，
  // 两个都认，避免以后关掉 withGlobalTauri 就认不出来。
  const tauri = typeof globalThis.__TAURI__ !== 'undefined'
             || typeof globalThis.__TAURI_INTERNALS__ !== 'undefined';
  const http = proto === 'http:' || proto === 'https:';
  const file = proto === 'file:';
  return {
    tauri, http, file, proto,
    /** 桌面外壳承载 —— 有原生菜单、可被外壳喂文件 */
    desktop: tauri,
    /** 有同源后端 —— 「载入示例」接口可用 */
    hasServer: http && !tauri,
    /** 文件名/展示用的形态标识 */
    name: tauri ? 'desktop' : (http ? 'server' : (file ? 'standalone' : 'unknown')),
    label: tauri ? '桌面版' : (http ? '本地服务' : (file ? '单文件版' : '网页')),
  };
})();

/* ═══════════════════════ 小工具 ═══════════════════════ */

function fmtTime(ms) {
  const s = ms / 1000;

  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${sec.toFixed(3).padStart(6, '0')}`;
}
const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(2) + ' MB' : (n / 1024).toFixed(1) + ' KB';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/**
 * 报文的「语义类别」——只看报文自身的协议属性，不看 CRC 是否通过。
 * 用于给「被确认的报文」取配色（坏包仍要显示为错误色，但它的语义类别依旧有效）。
 */
function toneOf(p) {
  if (p.msgType === 'VDM') return 'VDM';
  if (p.msgKind === 'ext') return 'Extended';
  if (p.msgKind === 'data') return 'Data';
  if (p.msgKind === 'special') return 'Error';
  return 'Control';
}
/** 报文颜色分类（用于「报文类别」筛选 + 字体配色）：坏包一律归错误色 */
function kindOf(p) {
  if (p.crcOk === false) return 'Error';
  return toneOf(p);
}
const CAT_CLASS = { Control: 'cat-Control', Data: 'cat-Data', Extended: 'cat-Extended', VDM: 'cat-VDM', Error: 'cat-Error' };

/**
 * GOOD CRC 配色配对（界面侧）。
 *
 * 配对关系由内核 `linkGoodCrc()` 算好（p.ackOf），这里只负责取色：
 * 让回应包与它所确认的报文同色，一眼看出「哪条被谁确认了」；
 * 否则 GOOD CRC 只能笼统地取 Control 色，与它确认的报文各成一色。
 *
 * 坏掉的 GOOD CRC 保持错误色，不参与配对。
 */
function pairAckTone(packets) {
  for (const p of packets) {
    p.tone = p.kind;
    if (p.ackOf == null) continue;
    if (p.crcOk === false) continue;
    const ref = packets[p.ackOf];
    if (ref) p.tone = toneOf(ref);
  }
}

/** 打开一份抓包：读字节 -> 解析容器 -> 选通道 -> 解码 */
async function loadFile(file) {
  S.cancel = false;
  showProgress('正在读取文件…', file.name);
  try {
    const t0 = performance.now();
    const buf = new Uint8Array(await file.arrayBuffer());
    setProgress(0.05, `${fmtSize(buf.length)} 已载入，解析容器…`);

    const cap = await AtkccCapture.open(buf, { inflate });
    S.cap = cap; S.meta = cap.meta;
    S.fileName = file.name; S.fileSize = buf.length;
    S.rate = cap.meta.sampleRate;      // 先用文件声明的值，解码时再由波形自检核一遍

    const chs = cap.meta.channels;
    // 多通道时扫描活动度，自动挑一个「有报文」的通道
    let pick = chs[0].channel;
    if (chs.length > 1) {
      showProgress('正在扫描各通道活动度…', `${chs.length} 个通道`);
      S.chActivity = new Map();
      for (let i = 0; i < chs.length; i++) {
        const r = await scanChannelActivity(cap, chs[i].channel, inflate, 3);
        S.chActivity.set(chs[i].channel, r.activity);
        setProgress(0.05 + 0.25 * (i + 1) / chs.length, `通道 ${chs[i].channel}：${r.activity} 个活动字节`);
      }
      let best = chs[0], bestA = -1;
      for (const c of chs) { const a = S.chActivity.get(c.channel) ?? 0; if (a > bestA) { bestA = a; best = c; } }
      pick = best.channel;
    }

    renderMeta();
    renderChannels();
    await decodeAndShow(pick);
    const dt = Math.round(performance.now() - t0);
    toast(`解析完成 · ${S.packets.length} 条报文 · ${dt} ms`, 'ok');
  } catch (err) {
    console.error(err);
    toast('解析失败：' + (err?.message || err), 'err');
    hideProgress();
  }
}

/** 解码指定通道并刷新整个界面 */
async function decodeAndShow(channel) {
  if (!S.cap) return;
  S.cancel = false;
  S.channel = channel;
  showProgress(`正在解码通道 ${channel}…`, 'BMC 位流 → 4B5B → PD 报文');

  const t0 = performance.now();
  const { packets, stats } = await decodeChannel(S.cap, channel, {
    inflate,
    bitOrder: 'lsb',
    shouldStop: () => S.cancel,
    onProgress: (p) => setProgress(0.3 + 0.65 * p.ratio, `分块 ${p.chunk}/${p.chunks} · 已解出 ${p.packets} 条`),
  });

  // 附上 VBUS / IBUS
  const bus = S.cap.meta.bus;
  for (const p of packets) {
    let v = 0, i = 0;
    if (bus && bus.length) {
      let lo = 0, hi = bus.length - 1, ans = 0;
      while (lo <= hi) { const m = (lo + hi) >> 1; if (bus[m].sample <= p.startSample) { ans = m; lo = m + 1; } else hi = m - 1; }
      v = bus[ans].vbus; i = bus[ans].ibus;
    }
    p.vbus = v; p.ibus = i;
    p.kind = kindOf(p);
  }
  pairAckTone(packets);   // GOOD CRC 与它确认的报文同色
  S.packets = packets;
  S.stats = stats;
  S.decodedMs = Math.round(performance.now() - t0);
  // 采样率以解码时定下来的为准（文件声明 / 波形实测 / 兜底），后面所有「采样点 → 秒」都用它
  if (stats.sampleRate > 0) S.rate = stats.sampleRate;
  if (stats.sampleRateNote) toast(stats.sampleRateNote, 'warn');

  // 时间轴数据
  const total = stats.totalSamples || S.cap.meta.totalSamples || 1;
  S.busSeries = buildBusSeries(bus, total, S.rate, 2400);
  S.totalSamples = total;

  buildTypeList();
  resetTimeRange();
  applyFilters(true);
  renderMeta();
  renderChannels();
  setProgress(1, '完成');
  hideProgress();
  drawTimeline();
}
