<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta name="pdscope-standalone" content="1" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDScope · USB PD 抓包解析上位机</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   PDScope — 样式
   主题变量：html[data-theme="light" | "dark"]
   ═══════════════════════════════════════════════════════════════ */

:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Roboto, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Cascadia Mono", Consolas,
          "Liberation Mono", Menlo, monospace;

  --rh: 30px;                       /* 表格行高 */
  --r: 8px;                          /* 圆角 */
  --dur: .16s;
  --cols: 50px 64px 196px 40px 74px 44px 112px 126px minmax(200px,1fr) minmax(230px,2.1fr);
}

html[data-theme="light"]{
  --bg:        #eef1f5;
  --bg2:       #f7f9fb;
  --panel:     #ffffff;
  --panel-2:   #fafbfd;
  --line:      #e0e5eb;
  --line-2:    #eceff3;
  --tx:        #1b2027;
  --tx-2:      #5b6572;
  --tx-3:      #8b95a3;
  --accent:    #2563eb;
  --accent-2:  #1d4ed8;
  --accent-sf: #e8efff;

  --src:  #1d64e0;  --src-bg:  #e7f0ff;
  --snk:  #d2691e;  --snk-bg:  #fdefe2;
  --plug: #7a3cd8;  --plug-bg: #f1e9ff;

  --ctrl: #0e8ba1;  --data: #159c53;  --ext: #b98600;  --vdm: #7a3cd8;  --err: #d93838;

  --row-hover: #f2f6fd;
  --row-sel:   #dbeafe;
  --scroll:    #c9d1da;
  --shadow:    0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  --shadow-lg: 0 12px 40px -12px rgba(16,24,40,.35);
  --ok: #159c53; --warn: #b98600; --bad: #d93838;
}

html[data-theme="dark"]{
  --bg:        #0d1014;
  --bg2:       #12161c;
  --panel:     #161b22;
  --panel-2:   #1b212a;
  --line:      #262e38;
  --line-2:    #1f272f;
  --tx:        #e6eaf0;
  --tx-2:      #a2acba;
  --tx-3:      #737e8d;
  --accent:    #4d8dff;
  --accent-2:  #6ba0ff;
  --accent-sf: #17233a;

  --src:  #6ba0ff;  --src-bg:  #16233c;
  --snk:  #f0a35e;  --snk-bg:  #33260f;
  --plug: #b28bfa;  --plug-bg: #251a3c;

  --ctrl: #45c7dd;  --data: #4ed08a;  --ext: #e6bf4a;  --vdm: #b28bfa;  --err: #ff6b6b;

  --row-hover: #1c2430;
  --row-sel:   #1e3352;
  --scroll:    #39424e;
  --shadow:    0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg: 0 12px 40px -12px rgba(0,0,0,.8);
  --ok: #4ed08a; --warn: #e6bf4a; --bad: #ff6b6b;
}

*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  font-family:var(--font);
  font-size:12.5px;
  color:var(--tx);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.i{ width:14px; height:14px; flex:none; display:block; }
.spacer{ flex:1 1 auto; }
.row{ display:flex; align-items:center; }
.row.gap{ gap:6px; }
.row.wrap{ flex-wrap:wrap; }
.row.center{ justify-content:center; }
.mt6{ margin-top:6px; }
.hint{ font-weight:400; color:var(--tx-3); font-size:11px; }

/* ── 布局 ───────────────────────────────────────────── */
.app{ height:100vh; display:flex; flex-direction:column; }

.appbar{
  height:52px; flex:none;
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:var(--panel); border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(0,0,0,.02);
  z-index:30;
}
.brand{ display:flex; align-items:center; gap:9px; }
.logo{ width:29px; height:29px; flex:none; }
.brand-txt{ display:flex; flex-direction:column; line-height:1.15; }
.brand-txt b{ font-size:14px; letter-spacing:.2px; }
.brand-txt span{ font-size:10.5px; color:var(--tx-3); }

.file-chip{
  display:flex; align-items:center; gap:6px; max-width:340px;
  padding:5px 11px; border-radius:999px;
  background:var(--bg2); border:1px solid var(--line);
  color:var(--tx-2); font-size:11.5px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.file-chip.has{ color:var(--tx); border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); background:var(--accent-sf); }
.file-chip .i{ color:var(--accent); }

.meta-chips{ display:flex; gap:6px; flex-wrap:nowrap; overflow:hidden; }
.mchip{
  font-size:10.5px; padding:3px 8px; border-radius:6px;
  background:var(--bg2); border:1px solid var(--line); color:var(--tx-2);
  white-space:nowrap; font-family:var(--mono);
}
.mchip b{ color:var(--tx); font-weight:600; }

.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center;
  height:30px; padding:0 12px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel);
  color:var(--tx); font:inherit; font-size:12px; font-weight:500;
  transition:background var(--dur), border-color var(--dur), transform var(--dur);
  white-space:nowrap;
}
.btn:hover:not(:disabled){ background:var(--bg2); border-color:var(--tx-3); }
.btn:active:not(:disabled){ transform:translateY(.5px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover:not(:disabled){ background:var(--accent-2); border-color:var(--accent-2); }
.btn.ghost{ background:transparent; border-color:transparent; }
.btn.ghost:hover:not(:disabled){ background:var(--bg2); border-color:var(--line); }
.btn.icon-only{ width:30px; padding:0; }
.btn.tiny{ height:24px; padding:0 9px; font-size:11px; border-radius:6px; }
.btn.block{ width:100%; height:28px; font-size:11.5px; }

.body{ flex:1 1 auto; display:flex; min-height:0; }

/* ── 侧栏 ───────────────────────────────────────────── */
.sidebar{
  width:236px; flex:none; background:var(--panel);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  transition:width .18s ease, opacity .18s ease;
}
body.side-collapsed .sidebar{ width:0; opacity:0; overflow:hidden; border-right:none; }
.side-scroll{ flex:1 1 auto; overflow-y:auto; padding:12px 12px 20px; }

.fgroup{ margin-bottom:15px; }
.fgroup h4{
  margin:0 0 7px; font-size:10.5px; font-weight:600; letter-spacing:.6px;
  text-transform:uppercase; color:var(--tx-3); display:flex; align-items:baseline; gap:6px;
}
.chips{ display:flex; flex-wrap:wrap; gap:5px; }
.chip{
  display:inline-flex; align-items:center; gap:5px;
  height:24px; padding:0 9px; border-radius:6px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--tx-2); font:inherit; font-size:11px;
  opacity:.5; transition:all var(--dur);
}
.chip.is-on{ opacity:1; }
.chip:hover{ border-color:var(--tx-3); }
.chip i{ font-style:normal; font-family:var(--mono); font-size:10px; opacity:.75; }
.chip.role-src.is-on  { color:var(--src);  border-color:color-mix(in srgb,var(--src) 45%,transparent);  background:var(--src-bg); }
.chip.role-snk.is-on  { color:var(--snk);  border-color:color-mix(in srgb,var(--snk) 45%,transparent);  background:var(--snk-bg); }
.chip.role-plug.is-on { color:var(--plug); border-color:color-mix(in srgb,var(--plug) 45%,transparent); background:var(--plug-bg); }
.chip.cat-ctrl.is-on{ color:var(--ctrl); border-color:color-mix(in srgb,var(--ctrl) 45%,transparent); }
.chip.cat-data.is-on{ color:var(--data); border-color:color-mix(in srgb,var(--data) 45%,transparent); }
.chip.cat-ext.is-on { color:var(--ext);  border-color:color-mix(in srgb,var(--ext) 45%,transparent); }
.chip.cat-vdm.is-on { color:var(--vdm);  border-color:color-mix(in srgb,var(--vdm) 45%,transparent); }
.chip.cat-err.is-on { color:var(--err);  border-color:color-mix(in srgb,var(--err) 45%,transparent); }

.switch{
  display:flex; align-items:center; gap:8px; padding:4px 0;
  font-size:11.5px; color:var(--tx-2); cursor:pointer; user-select:none;
}
.switch input{ display:none; }
.switch span{
  width:28px; height:16px; border-radius:999px; flex:none; position:relative;
  background:var(--line); transition:background var(--dur);
}
.switch span::after{
  content:""; position:absolute; top:2px; left:2px; width:12px; height:12px;
  border-radius:50%; background:#fff; transition:transform var(--dur);
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.switch input:checked + span{ background:var(--accent); }
.switch input:checked + span::after{ transform:translateX(12px); }
.switch input:checked ~ *{ color:var(--tx); }
.switch.sm{ font-size:11px; }

.text{
  width:100%; height:28px; padding:0 9px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel-2);
  color:var(--tx); font:inherit; font-size:11.5px; outline:none;
}
.text:focus{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-sf); }

.chlist{ display:flex; flex-direction:column; gap:4px; }
.chitem{
  display:flex; align-items:center; gap:8px; padding:6px 9px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel-2); cursor:pointer;
  font-size:11.5px; color:var(--tx-2);
}
.chitem.is-on{ border-color:var(--accent); background:var(--accent-sf); color:var(--tx); }
.chitem b{ font-family:var(--mono); }
.chitem .act{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--tx-3); }

.multisel{ position:relative; }
.ms-head{
  width:100%; height:28px; padding:0 9px; border-radius:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2); color:var(--tx);
  font:inherit; font-size:11.5px; text-align:left;
  display:flex; align-items:center; justify-content:space-between;
}
.ms-head .caret{
  width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent;
  border-top:5px solid var(--tx-3);
}
.ms-body{
  display:none; margin-top:5px; max-height:230px; overflow-y:auto;
  border:1px solid var(--line); border-radius:7px; background:var(--panel);
  padding:4px; box-shadow:var(--shadow);
}
.ms-body.open{ display:block; }
.ms-item{
  display:flex; align-items:center; gap:7px; padding:4px 6px; border-radius:5px;
  cursor:pointer; font-size:11.5px; color:var(--tx-2);
}
.ms-item:hover{ background:var(--bg2); }
.ms-item input{ margin:0; accent-color:var(--accent); }
.ms-item .cnt{ margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--tx-3); }
.ms-item .dot{ width:6px; height:6px; border-radius:50%; flex:none; }

.range-row{ position:relative; height:24px; }
.range-row input[type=range]{
  position:absolute; left:0; width:100%; margin:0; height:24px;
  -webkit-appearance:none; appearance:none; background:transparent; pointer-events:none;
}
.range-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); border:2px solid var(--panel); cursor:pointer;
  pointer-events:all; box-shadow:0 1px 3px rgba(0,0,0,.3); margin-top:-4px;
}
.range-row input[type=range]::-webkit-slider-runnable-track{
  height:5px; border-radius:3px; background:var(--line);
}

/* ── 中间主区 ───────────────────────────────────────── */
.main{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; background:var(--bg); }

.toolbar{
  height:40px; flex:none; display:flex; align-items:center; gap:8px;
  padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line);
}
.stat{ font-size:11.5px; color:var(--tx-2); font-variant-numeric:tabular-nums; }
.stat b{ color:var(--tx); }
.stat .bad{ color:var(--bad); font-weight:600; }

.seg{ display:flex; padding:2px; border-radius:7px; background:var(--bg2); border:1px solid var(--line); }
.seg-item{
  height:22px; padding:0 10px; border:none; border-radius:5px; cursor:pointer;
  background:transparent; color:var(--tx-2); font:inherit; font-size:11px;
}
.seg-item.is-on{ background:var(--panel); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }

.table-wrap{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  background:var(--panel); position:relative; overflow:hidden;
}
.thead{
  display:grid; grid-template-columns:var(--cols); flex:none;
  border-bottom:1px solid var(--line); background:var(--panel-2);
  position:sticky; top:0; z-index:5;
}
.th{
  padding:7px 8px; font-size:10.5px; font-weight:600; letter-spacing:.3px;
  color:var(--tx-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  cursor:pointer; user-select:none; border-right:1px solid var(--line-2);
}
.th:hover{ color:var(--tx); }
.th.sorted::after{ content:" ▾"; color:var(--accent); }
.th.sorted.asc::after{ content:" ▴"; }

.tbody{ flex:1 1 auto; overflow:auto; position:relative; }
.vph{ width:1px; }
.vrows{ position:absolute; top:0; left:0; right:0; }

.tr{
  display:grid; grid-template-columns:var(--cols);
  height:var(--rh); align-items:center;
  border-bottom:1px solid var(--line-2);
  cursor:pointer; position:relative;
}
.tr::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:transparent;
}
.tr:hover{ background:var(--row-hover); }
.tr.sel{ background:var(--row-sel); }
.tr.sel::before{ background:var(--accent); }
.tr.bad::before{ background:var(--err); }
.tr.bad{ background:color-mix(in srgb, var(--err) 7%, transparent); }

.td{
  padding:0 8px; font-size:11.5px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; color:var(--tx-2);
}
.td.mono{ font-family:var(--mono); font-size:11px; }
.td.num{ font-family:var(--mono); color:var(--tx-3); text-align:right; }
.td.type{ font-weight:600; }
.td.time{ font-family:var(--mono); font-size:10.5px; color:var(--tx-3); }
.td.bus{ font-family:var(--mono); font-size:10.5px; }
.td.bus em{ font-style:normal; color:var(--tx-3); }
.td.note{ color:var(--tx-2); font-size:11px; }

.pill{
  display:inline-block; padding:1px 6px; border-radius:5px; font-size:10px;
  font-weight:600; font-family:var(--mono); letter-spacing:.3px;
  border:1px solid transparent;
}
.pill.SRC { color:var(--src);  background:var(--src-bg);  border-color:color-mix(in srgb,var(--src) 35%,transparent); }
.pill.SNK { color:var(--snk);  background:var(--snk-bg);  border-color:color-mix(in srgb,var(--snk) 35%,transparent); }
.pill.Plug{ color:var(--plug); background:var(--plug-bg); border-color:color-mix(in srgb,var(--plug) 35%,transparent); }
.pill.sop{ color:var(--tx-3); background:var(--bg2); border-color:var(--line); }

.cat-Control  { color:var(--ctrl); }
.cat-Data     { color:var(--data); }
.cat-Extended { color:var(--ext);  }
.cat-VDM      { color:var(--vdm);  }
.cat-Error    { color:var(--err);  }
.cat-Plug     { color:var(--plug); }
.td.type.cat-Data{ font-weight:700; }

.mark{ background:color-mix(in srgb,var(--warn) 35%,transparent); border-radius:3px; padding:0 2px; }

.empty{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:9px;
  background:var(--panel); color:var(--tx-2); text-align:center; padding:24px;
}
.empty-art{ width:74px; height:74px; color:var(--accent); opacity:.75; }
.empty h3{ margin:0; font-size:15px; color:var(--tx); }
.empty p{ margin:0; font-size:12px; max-width:420px; color:var(--tx-3); }
.empty .tiny-note{ font-size:11px; color:var(--tx-3); }

/* ── 时间轴 ─────────────────────────────────────────── */
.timeline{
  flex:none; height:158px; background:var(--panel);
  border-top:1px solid var(--line); display:flex; flex-direction:column;
  position:relative;
}
.tl-head{
  height:28px; flex:none; display:flex; align-items:center; gap:8px;
  padding:0 12px; border-bottom:1px solid var(--line-2);
}
.tl-title{ font-size:11px; font-weight:600; color:var(--tx-2); }
#busCanvas{ flex:1 1 auto; width:100%; display:block; cursor:crosshair; }
.tl-tip{
  position:absolute; pointer-events:none; display:none;
  padding:4px 7px; border-radius:6px; font-size:10.5px; font-family:var(--mono);
  background:var(--tx); color:var(--panel); white-space:nowrap;
  transform:translate(-50%,-115%); z-index:20;
}

/* ── 详情面板 ───────────────────────────────────────── */
.detail{
  width:390px; flex:none; background:var(--panel);
  border-left:1px solid var(--line); display:flex; flex-direction:column;
  transition:width .18s ease, opacity .18s ease;
}
body.detail-collapsed .detail{ width:0; opacity:0; overflow:hidden; border-left:none; }
.detail-head{
  height:40px; flex:none; display:flex; align-items:center; gap:4px;
  padding:0 8px 0 12px; border-bottom:1px solid var(--line);
}
.detail-head b{ font-size:12px; }
.detail-body{ flex:1 1 auto; overflow-y:auto; padding:12px; }
.detail-empty{ color:var(--tx-3); font-size:12px; text-align:center; padding-top:36px; }

.dsec{ margin-bottom:14px; }
.dsec > h5{
  margin:0 0 7px; font-size:10.5px; font-weight:600; letter-spacing:.6px;
  text-transform:uppercase; color:var(--tx-3);
}
.dhero{
  padding:11px; border-radius:9px; border:1px solid var(--line);
  background:var(--panel-2); margin-bottom:12px;
}
.dhero .t1{ font-size:15px; font-weight:700; margin-bottom:5px; }
.dhero .t2{ font-size:11px; color:var(--tx-3); font-family:var(--mono); }
.dhero-bad{ border-color:color-mix(in srgb,var(--err) 45%,transparent); background:color-mix(in srgb,var(--err) 8%,transparent); }

.dgrid{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-2);
        border:1px solid var(--line-2); border-radius:8px; overflow:hidden; }
.dcell{ background:var(--panel); padding:6px 9px; }
.dcell .k{ font-size:10px; color:var(--tx-3); margin-bottom:2px; }
.dcell .v{ font-size:11.5px; font-family:var(--mono); color:var(--tx); word-break:break-all; }

.dbits{ border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.dbit{
  display:grid; grid-template-columns:104px 1fr; gap:0;
  border-bottom:1px solid var(--line-2); font-size:11px;
}
.dbit:last-child{ border-bottom:none; }
.dbit .bk{ padding:5px 9px; color:var(--tx-3); background:var(--panel-2); }
.dbit .bv{ padding:5px 9px; font-family:var(--mono); color:var(--tx); word-break:break-all; }
.dbit .bv u{ text-decoration:none; color:var(--accent); }

.dobj{
  border:1px solid var(--line); border-radius:8px; margin-bottom:7px; overflow:hidden;
}
.dobj-h{
  padding:5px 9px; background:var(--panel-2); font-size:11px; font-weight:600;
  display:flex; align-items:center; gap:7px; border-bottom:1px solid var(--line-2);
}
.dobj-h .k{ color:var(--tx-3); font-family:var(--mono); font-weight:400; margin-left:auto; }
.dobj-b{ padding:7px 9px; font-size:11px; color:var(--tx-2); }

.dwarn{
  display:flex; gap:7px; padding:6px 9px; border-radius:7px; font-size:11px;
  background:color-mix(in srgb,var(--warn) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);
  color:var(--tx); margin-bottom:6px;
}
.dwarn.err{ background:color-mix(in srgb,var(--err) 12%,transparent);
            border-color:color-mix(in srgb,var(--err) 40%,transparent); }

.hx{ font-family:var(--mono); font-size:11px; line-height:1.65; word-break:break-all; }
.hx b{ color:var(--accent); font-weight:600; }

/* ── 拖拽 / 进度 / toast ────────────────────────────── */
.drop{
  position:fixed; inset:0; z-index:100; display:none;
  background:color-mix(in srgb, var(--accent) 14%, rgba(0,0,0,.35));
  backdrop-filter:blur(3px);
  align-items:center; justify-content:center;
}
.drop.show{ display:flex; }
.drop-inner{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:34px 52px; border-radius:16px; border:2px dashed var(--accent);

<script>
(function(){
"use strict";
/* ══════ src/js/core/zip.js ══════ */
/**
 * zip.js — 最小化、零依赖的 ZIP 读取器（支持 ZIP64）
 *
 * .atkcc 抓包文件本质上是一个普通 ZIP 压缩包：
 *   channel.ini           采样率配置
 *   bus.ini               VBUS / IBUS 模拟量轨迹
 *   0/channel.ini         通道元数据（含总采样点数）
 *   0/0-0.bin ...         各通道的数字采样数据，每块固定 1 MiB
 *
 * 这里只实现「读取」所需的最小集合：
 *   中央目录 -> 目录项 -> 本地文件头 -> raw deflate 解压
 */

const SIG_EOCD = 0x06054b50;
const SIG_EOCD64 = 0x06064b50;
const SIG_EOCD64_LOC = 0x07064b50;
const SIG_CDIR = 0x02014b50;
const SIG_LOCAL = 0x04034b50;

/** 在尾部 64 KiB + 22 字节范围内反向查找 EOCD 签名。 */
function findEocd(view, bytes) {
  const min = Math.max(0, bytes.length - (0xffff + 22));
  for (let i = bytes.length - 22; i >= min; i--) {
    if (view.getUint32(i, true) === SIG_EOCD) {
      // 注释长度必须与剩余字节吻合，避免误命中
      const commentLen = view.getUint16(i + 20, true);
      if (i + 22 + commentLen === bytes.length) return i;
    }
  }
  return -1;
}

class ZipEntry {
  constructor(o) { Object.assign(this, o); }
}

class ZipReader {
  /**
   * @param {Uint8Array} bytes 整个 .atkcc / .zip 文件内容
   */
  constructor(bytes) {
    this.bytes = bytes;
    this.view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    this.entries = [];
    this.byName = new Map();
    this._parse();
  }

  _parse() {
    const { view, bytes } = this;
    const eocd = findEocd(view, bytes);
    if (eocd < 0) throw new Error('不是有效的 ZIP 文件：未找到 EOCD 记录');

    let entryCount = view.getUint16(eocd + 10, true);
    let cdSize = view.getUint32(eocd + 12, true);
    let cdOffset = view.getUint32(eocd + 16, true);

    // ZIP64 升级
    if (entryCount === 0xffff || cdSize === 0xffffffff || cdOffset === 0xffffffff) {
      const loc = eocd - 20;
      if (loc >= 0 && view.getUint32(loc, true) === SIG_EOCD64_LOC) {
        const z64 = Number(view.getBigUint64(loc + 8, true));
        if (view.getUint32(z64, true) === SIG_EOCD64) {
          entryCount = Number(view.getBigUint64(z64 + 32, true));
          cdSize = Number(view.getBigUint64(z64 + 40, true));
          cdOffset = Number(view.getBigUint64(z64 + 48, true));
        }
      }
    }

    let p = cdOffset;
    const end = Math.min(cdOffset + cdSize, bytes.length);
    while (p + 46 <= end && view.getUint32(p, true) === SIG_CDIR) {
      const flags = view.getUint16(p + 8, true);
      const method = view.getUint16(p + 10, true);
      const dosTime = view.getUint16(p + 12, true);
      const dosDate = view.getUint16(p + 14, true);
      const crc32 = view.getUint32(p + 16, true);
      let compressedSize = view.getUint32(p + 20, true);
      let uncompressedSize = view.getUint32(p + 24, true);
      const nameLen = view.getUint16(p + 28, true);
      const extraLen = view.getUint16(p + 30, true);
      const commentLen = view.getUint16(p + 32, true);
      let localOffset = view.getUint32(p + 42, true);

      const name = new TextDecoder('utf-8').decode(bytes.subarray(p + 46, p + 46 + nameLen));

      // 解析 ZIP64 扩展字段
      let ep = p + 46 + nameLen;
      const extraEnd = ep + extraLen;
      while (ep + 4 <= extraEnd) {
        const hid = view.getUint16(ep, true);
        const hsz = view.getUint16(ep + 2, true);
        if (hid === 0x0001) {
          let q = ep + 4;
          const limit = ep + 4 + hsz;
          if (uncompressedSize === 0xffffffff && q + 8 <= limit) { uncompressedSize = Number(view.getBigUint64(q, true)); q += 8; }
          if (compressedSize === 0xffffffff && q + 8 <= limit) { compressedSize = Number(view.getBigUint64(q, true)); q += 8; }
          if (localOffset === 0xffffffff && q + 8 <= limit) { localOffset = Number(view.getBigUint64(q, true)); q += 8; }
        }
        ep += 4 + hsz;
      }

      const e = new ZipEntry({
        name, method, flags, crc32, compressedSize, uncompressedSize,
        localOffset, dosTime, dosDate,
        isDirectory: name.endsWith('/'),
      });
      this.entries.push(e);
      this.byName.set(name, e);
      p += 46 + nameLen + extraLen + commentLen;
    }
  }

  has(name) { return this.byName.has(name); }

  /** 返回该目录项的原始压缩数据切片（不解压）。 */
  raw(e) {
    const { view, bytes } = this;
    const lo = e.localOffset;
    if (view.getUint32(lo, true) !== SIG_LOCAL) throw new Error('本地文件头损坏：' + e.name);
    const nameLen = view.getUint16(lo + 26, true);
    const extraLen = view.getUint16(lo + 28, true);
    const start = lo + 30 + nameLen + extraLen;
    return bytes.subarray(start, start + e.compressedSize);
  }

  /**
   * 解压单个条目。
   * @param {string} name
   * @param {(raw:Uint8Array)=>Promise<Uint8Array>|Uint8Array} inflateRaw
   */
  async read(name, inflateRaw) {
    const e = this.byName.get(name);
    if (!e) return null;
    if (e.isDirectory) return new Uint8Array(0);
    const raw = this.raw(e);
    if (e.method === 0) return raw.slice();
    if (e.method !== 8) throw new Error(`不支持的压缩方式 ${e.method}（${name}）`);
    return await inflateRaw(raw, e.uncompressedSize);
  }

  /** 解压为文本（用于解析 ini）。 */
  async readText(name, inflateRaw) {
    const b = await this.read(name, inflateRaw);
    return b ? new TextDecoder('utf-8').decode(b) : null;
  }
}

/* ══════ src/js/core/atkcc.js ══════ */
/**
 * atkcc.js — 正点原子 ATK-C (.atkcc) 抓包文件格式解析
 *
 * 格式（实测归纳）：
 *   .atkcc 就是 ZIP：
 *     channel.ini        "SamplingFrequency=2500"   —— 数值单位是 kHz，即数字采样率 2.5 MHz
 *     bus.ini            "sample=N,vbus=1.234,ibus=0.567"  —— 模拟量轨迹，sample 与数字采样同域
 *     0/channel.ini      第 1 行=通道组号，第 2 行=总采样点数（所有通道共享同一时基）
 *     0/<ch>-<idx>.bin   通道 <ch> 的第 <idx> 块，每块固定 1 MiB
 *
 * 关键结论（已用官方 ATK-C 截图逐字段交叉验证，完全一致）：
 *   · 每个采样点 1 bit，**LSB 优先**（每字节内 bit0 时间最早）
 *   · 某字节 0xFF = 该 8 个采样点全高；0x00 = 全低（空载/空闲段，末块尾部为补齐）
 *   · 采样率 2.5 MHz；BMC 时钟 600 kHz（UI=1.6667us），故 1 UI ≈ 4.167 采样点、1 bit = 2 UI
 *   · 分块序号按数值排序（0-9 在 0-10 之前），最后一块尾部用 0x00 补齐
 */



const CHUNK_SIZE = 1048576;      // 1 MiB

class AtkccCapture {
  constructor(zip, meta) {
    this.zip = zip;
    this.meta = meta;
    /** @type {Map<number, {folder:string, prefixes:number[], chunks:string[]}>} */
    this.channels = meta.channels;
  }

  /**
   * 打开 .atkcc。
   * @param {Uint8Array} bytes
   * @param {{inflate:(raw:Uint8Array,n:number)=>Promise<Uint8Array>}} io
   */
  static async open(bytes, io) {
    const zip = new ZipReader(bytes);

    // ── channel.ini：采样率 ──
    const rootIni = await zip.readText('channel.ini', io.inflate);
    let samplingFrequency = 0;
    if (rootIni) {
      const m = /SamplingFrequency\s*=\s*([0-9.]+)/i.exec(rootIni);
      if (m) samplingFrequency = Number(m[1]);
    }
    // 实测 2500 的单位是 kHz。若文件给出的是 Hz 量级（<100000），按 Hz 处理。
    const sampleRate = samplingFrequency > 0
      ? (samplingFrequency >= 100000 ? samplingFrequency : samplingFrequency * 1000)
      : 2500000;

    // ── bus.ini：VBUS / IBUS ──
    const busIni = await zip.readText('bus.ini', io.inflate);
    const bus = [];
    if (busIni) {
      for (const line of busIni.split(/\r?\n/)) {
        const t = line.trim();
        if (!t) continue;
        const m = /sample\s*=\s*(\d+)\s*,\s*vbus\s*=\s*(-?[\d.]+)\s*,\s*ibus\s*=\s*(-?[\d.]+)/i.exec(t);
        if (m) bus.push({ sample: Number(m[1]), vbus: Number(m[2]), ibus: Number(m[3]) });
      }
    }

    // ── 各通道分块清单 ──
    const channelMap = new Map();
    const re = /^(\d+)\/(\d+)-(\d+)\.bin$/i;
    for (const e of zip.entries) {
      const m = re.exec(e.name);
      if (!m) continue;
      const folder = m[1];
      const ch = Number(m[2]);
      const idx = Number(m[3]);
      let c = channelMap.get(ch);
      if (!c) { c = { channel: ch, folder, chunks: [] }; channelMap.set(ch, c); }
      c.chunks.push({ idx, name: e.name, size: e.uncompressedSize });
    }
    for (const c of channelMap.values()) {
      c.chunks.sort((a, b) => a.idx - b.idx);
      c.totalBytes = c.chunks.reduce((s, x) => s + x.size, 0);
      c.totalSamples = c.totalBytes * 8;
    }

    // ── 总采样数 ──
    let totalSamples = 0;
    const subIni = await zip.readText('0/channel.ini', io.inflate);
    if (subIni) {
      const lines = subIni.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      if (lines.length >= 2) totalSamples = Number(lines[1]) || 0;
    }
    const channelList = [...channelMap.values()].sort((a, b) => a.channel - b.channel);
    if (!totalSamples) totalSamples = channelList[0]?.totalSamples ?? 0;

    return new AtkccCapture(zip, {
      sampleRate,
      samplingFrequencyRaw: samplingFrequency,
      rawChannelIni: subIni,
      totalSamples,
      channels: channelList,
      channelMap,
      bus,
      entryCount: zip.entries.length,
    });
  }

  get durationSec() { return this.meta.totalSamples / this.meta.sampleRate; }

  /** 读取某通道某块（已解压） */
  async readChunk(channel, chunkIdx, inflate) {
    const c = this.meta.channelMap.get(channel);
    if (!c) return null;
    const item = c.chunks[chunkIdx];
    if (!item) return null;
    return await this.zip.read(item.name, inflate);
  }

  /**
   * 计算某通道真正的有效采样上限。
   *   · 单通道文件：直接使用 channel.ini 里的总采样数
   *   · 多通道文件：尾部 0x00 是补齐用的，按最后一段非零数据裁掉
   */
  effectiveSampleLimit(channel) {
    const c = this.meta.channelMap.get(channel);
    if (!c) return 0;
    if (this.meta.channels.length === 1) {
      return Math.min(this.meta.totalSamples, c.totalSamples);
    }
    // 多通道：交由 chunk 级裁剪（loadChunkTrimmed）处理
    return c.totalSamples;
  }

  /** 读取最后一块并裁掉尾部 0x00 补齐区 */
  static trimTrailingZeros(data) {
    let end = data.length;
    while (end > 0 && data[end - 1] === 0) end--;
    return end;
  }
}

/**
 * 对某个通道做活动度扫描：统计非空闲字节数量，用于判断哪条线才是 CC / 有报文。
 * 只扫前 maxChunks 块，保证耗时可控。
 */
async function scanChannelActivity(capture, channel, inflate, maxChunks = 4, onProgress) {
  const c = capture.meta.channelMap.get(channel);
  if (!c) return { channel, activity: 0, bytes: 0, scannedChunks: 0 };
  let activity = 0, bytes = 0;
  const n = Math.min(maxChunks, c.chunks.length);
  for (let i = 0; i < n; i++) {
    const d = await capture.readChunk(channel, i, inflate);
    if (!d) continue;
    for (let k = 0; k < d.length; k++) if (d[k] !== 0xFF) activity++;
    bytes += d.length;
    onProgress?.(channel, i + 1, n);
  }
  return { channel, activity, bytes, scannedChunks: n };
}

/**
 * bmc.js — USB PD 的 BMC（Biphase Mark Coding）解码
 *
 * 完全对齐 sigrok `usb_power_delivery` 解码器的实现语义：
 *   UI            = 1 / 600kHz = 1.6667 µs        （单位间隔 = 半位）
 *   threshold     = 1.5 * UI   = 2.5   µs          （区分「半位1」与「位0」）
 *   maxbit        = 3 * UI     = 5.0   µs          （超过即视为空闲，包结束）
 *
 * 状态机（与参考实现一致）：
 *   diff = 本次边沿 - 上次边沿
 *   isZero = diff > threshold
 *   位0  : isZero && !halfOne
 *   位1  : !isZero && halfOne
 *   half : !isZero && !halfOne  -> 记 halfOne
 *   other: 非法序列，按 0 处理并记录
 */

const UI_US = 1000000 / 600000;            // 1.6666666...
const THRESHOLD_US = (UI_US + 2 * UI_US) / 2; // 2.5
const MAXBIT_US = 3 * UI_US;               // 5.0

/**
 * 针对某个字节值，预算好其 8 个采样位形成的游程。
 * 结果是 [{ bit, len }, ...]，并保证相邻项 bit 一定不同。
 * 这样扫描时可以避免逐位循环。
 *
 * 两种位序都预先算好：
 *   msb —— bit7 是最早的采样；
 *   lsb —— bit0 是最早的采样。
 *
 * ★ 实测正点原子 ATK-C 导出的 .bin 采用 **LSB 优先**（每字节内 bit0 时间最早）。
 *   用 LSB 解出的游程长度干净地聚集在 4 / 8 采样点（≈1UI / 2UI，2.5MHz 采样、
 *   600kHz BMC 时钟、300kbps 数据率），且报文开头呈现规整的 1010… SOP 前导；
 *   用 MSB 则游程散乱在 1~3 个采样点且无法解出报文。故默认 LSB。
 */
const BYTE_RUNS_MSB = (() => {
  const t = new Array(256);
  for (let b = 0; b < 256; b++) {
    const out = [];
    for (let k = 7; k >= 0; k--) {
      const bit = (b >> k) & 1;
      if (out.length && out[out.length - 1].bit === bit) out[out.length - 1].len++;
      else out.push({ bit, len: 1 });
    }
    t[b] = out;
  }
  return t;
})();

const BYTE_RUNS_LSB = (() => {
  const t = new Array(256);
  for (let b = 0; b < 256; b++) {
    const out = [];
    for (let k = 0; k < 8; k++) {
      const bit = (b >> k) & 1;
      if (out.length && out[out.length - 1].bit === bit) out[out.length - 1].len++;
      else out.push({ bit, len: 1 });
    }
    t[b] = out;
  }
  return t;
})();

/**
 * 从字节流中提取电平游程（run），并转换为「边沿采样点」序列。
 *
 * 采样约定：每个字节 8 个采样点。默认 LSB 优先（bit0 是最早的采样）。
 */
class EdgeExtractor {
  /** @param {{bitOrder?: 'lsb'|'msb'}} [opts] */
  constructor(opts = {}) {
    this.runs = (opts.bitOrder || 'lsb') === 'msb' ? BYTE_RUNS_MSB : BYTE_RUNS_LSB;
    this.level = -1;      // 当前电平，-1 表示尚未确定
    this.runStart = 0;    // 当前游程起始采样序号
    this.sample = 0;      // 已消费的采样点数
    this.started = false;
  }

  /**
   * 处理一整块数据。
   * @param {Uint8Array} data
   * @param {number} baseSample 该块第一个采样点对应的全局采样序号
   * @param {(edgeSample:number)=>void} onEdge 电平翻转时的全局采样序号
   */
  push(data, baseSample, onEdge) {
    let sample = baseSample;
    for (let i = 0; i < data.length; i++) {
      const b = data[i];
      if (b === 0) {
        // 全 0：8 个采样点为低
        if (this.level === 0) { /* 延续 */ }
        else { onEdge(sample); this.level = 0; this.runStart = sample; }
        sample += 8;
        continue;
      }
      if (b === 0xff) {
        // 全 1：8 个采样点为高（绝大多数数据都是这种，走快路径）
        if (this.level === 1) { /* 延续 */ }
        else { onEdge(sample); this.level = 1; this.runStart = sample; }
        sample += 8;
        continue;
      }
      const runs = this.runs[b];
      for (let r = 0; r < runs.length; r++) {
        const run = runs[r];
        if (this.level !== run.bit) {
          onEdge(sample);
          this.level = run.bit;
          this.runStart = sample;
        }
        sample += run.len;
      }
    }
    this.sample = sample;
  }

  /** 收尾：补一个虚拟边沿，让最后一个包也能被刷新出来。 */
  flush(onEdge, padSamples) {
    onEdge(this.sample + padSamples);
  }
}

/**
 * PD 包的 BMC 状态机。边沿进来，包出去。
 */
class BmcDecoder {
  constructor({ sampleRate, minEdges = 50, thresholdSamples = null, maxbitSamples = null }) {
    this.sampleRate = sampleRate;
    this.minEdges = minEdges;
    this.threshold = thresholdSamples != null
      ? thresholdSamples
      : Math.max(1, Math.round(THRESHOLD_US * sampleRate / 1e6));
    this.maxbit = maxbitSamples != null
      ? maxbitSamples
      : Math.max(1, Math.round(MAXBIT_US * sampleRate / 1e6));
    this.reset();
  }

  reset() {
    this.startsample = null;
    this.previous = 0;
    this.bits = [];
    this.edges = [];
    this.bad = [];
    this.halfOne = false;
    this.startOne = 0;
  }

  /**
   * 送入一个边沿。
   * @returns {null|{bits:number[],edges:number[],startSample:number,endSample:number,bad:number[][],bitrate:number}}
   */
  pushEdge(sample, flush = false) {
    if (this.startsample === null) {
      this.startsample = sample;
      this.previous = sample;
      return null;
    }

    const diff = sample - this.previous;

    // 长时间空闲 => 视为包结束
    if (diff > this.maxbit || flush) {
      if (!flush) this.edges.push(this.previous);
      const packet = this._emit();
      // 重新开始
      this.startsample = flush ? null : sample;
      this.bits = [];
      this.edges = [];
      this.bad = [];
      this.halfOne = false;
      this.startOne = 0;
      this.previous = sample;
      return packet;
    }

    const isZero = diff > this.threshold;
    if (isZero && !this.halfOne) {
      this.bits.push(0);
      this.edges.push(this.previous);
    } else if (!isZero && this.halfOne) {
      this.bits.push(1);
      this.edges.push(this.startOne);
      this.halfOne = false;
    } else if (!isZero && !this.halfOne) {
      this.halfOne = true;
      this.startOne = this.previous;
    } else {
      this.bad.push([this.startOne, this.previous]);
      this.bits.push(0);
      this.edges.push(this.previous);
      this.halfOne = false;
    }
    this.previous = sample;
    return null;
  }

  _emit() {
    if (this.edges.length < this.minEdges) return null;
    const ss = this.edges[0];
    const es = this.edges[this.edges.length - 1];
    if (!(es > ss)) return null;
    const bitrate = Math.round(this.sampleRate * this.bits.length / (es - ss));
    return {
      bits: this.bits,
      edges: this.edges,
      startSample: this.startsample,
      endSample: es,
      bad: this.bad,
      bitrate,
    };
  }
}
